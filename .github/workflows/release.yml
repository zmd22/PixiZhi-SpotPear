# Builds the public firmware for every published GitHub release and attaches:
#   manifest.json            - read by the device's Firmware update entity
#   pixizhi-<ver>.ota.bin    - over-the-air image (MD5 in the manifest)
#   pixizhi-<ver>.factory.bin- full image for first-time USB flashing
# It also publishes the browser installer (install/) to GitHub Pages.
name: Release firmware

on:
  release:
    types: [published]
  workflow_dispatch: # test build only, nothing is uploaded

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Pinned ESPHome dev commit the firmware was validated against.
  ESPHOME_REF: 354660cafc8c3baf5b8656f5febd03623831322a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install "esphome @ git+https://github.com/esphome/esphome.git@${ESPHOME_REF}"

      - name: Check release tag matches firmware version
        id: ver
        run: |
          VERSION=$(grep -m1 -E '^\s+version: "' pixizhi.yaml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${TAG#v}" != "$VERSION" ]; then
              echo "::error::Tag $TAG does not match firmware version $VERSION in pixizhi.yaml"
              exit 1
            fi
          fi

      - name: Compile
        run: esphome compile pixizhi.yaml

      - name: Collect images and write manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          B=.esphome/build/pixizhi/build
          mkdir -p out site
          cp "$B/firmware.ota.bin" "out/pixizhi-$VERSION.ota.bin"
          cp "$B/firmware.factory.bin" "out/pixizhi-$VERSION.factory.bin"
          MD5=$(md5sum "out/pixizhi-$VERSION.ota.bin" | cut -d' ' -f1)
          python3 - <<PY
          import json, os
          v, repo, tag, md5 = os.environ["VERSION"], os.environ["REPO"], os.environ.get("TAG") or "v" + os.environ["VERSION"], "$MD5"
          base = f"https://github.com/{repo}/releases/download/{tag}"
          # Home Assistant shows "summary" in the update dialog (max 255 characters).
          body = " ".join((os.environ.get("RELEASE_BODY") or "").split())
          title = os.environ.get("RELEASE_NAME") or f"PixiZhi SpotPear {v}"
          summary = (title + (": " + body if body else ""))
          if len(summary) > 255:
              summary = summary[:252].rstrip() + "..."
          ota = {"path": f"{base}/pixizhi-{v}.ota.bin", "md5": md5,
                 "summary": summary,
                 "release_url": f"https://github.com/{repo}/releases/tag/{tag}"}
          # Device update manifest (absolute URLs).
          json.dump({"name": "PixiZhi SpotPear", "version": v, "new_install_prompt_erase": True,
                     "builds": [{"chipFamily": "ESP32-S3", "ota": ota,
                                 "parts": [{"path": f"{base}/pixizhi-{v}.factory.bin", "offset": 0}]}]},
                    open("out/manifest.json", "w"), indent=2)
          # Browser installer manifest: the image is served from Pages (same origin).
          json.dump({"name": "PixiZhi SpotPear", "version": v, "new_install_prompt_erase": True,
                     "builds": [{"chipFamily": "ESP32-S3",
                                 "parts": [{"path": "firmware.factory.bin", "offset": 0}]}]},
                    open("site/manifest.json", "w"), indent=2)
          PY
          cp "out/pixizhi-$VERSION.factory.bin" site/firmware.factory.bin
          sed "s/__VERSION__/$VERSION/g" install/index.html > site/index.html
          ls -l out site

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'release' && !github.event.release.prerelease
        with:
          path: site

  pages:
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
