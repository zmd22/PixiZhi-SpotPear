          default: []
          selector:
            action: {}
        counterclockwise_action:
          name: Counterclockwise rotation — additional action
          default: []
          selector:
            action: {}
        long_press_action:
          name: Standby long-press action
          description: Runs when you hold your finger on the clock and the device's Standby Long-press setting is "HA action".
          default: []
          selector:
            action: {}
    battery_threshold:
      name: Thermostat low-battery warning below (%)
      description: Uses the thermostat's battery attribute, or a sensor named like sensor.<thermostat>_battery.
      default: 20
      selector:
        number:
          min: 5
          max: 50
          unit_of_measurement: "%"
