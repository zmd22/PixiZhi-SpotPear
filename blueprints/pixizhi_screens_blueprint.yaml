blueprint:
  name: PixiZhi SpotPear - screens and controls
  description: >-
    Pick up to 6 lights, switches, media players or thermostats to show on the PixiZhi SpotPear,
    plus the weather entity for the standby screen.
    The order you pick them in is the order the screens appear in.
    Needs "Allow the device to perform Home Assistant actions" turned on in the
    PixiZhi SpotPear's ESPHome device settings.
  domain: automation
  source_url: https://raw.githubusercontent.com/zmd22/PixiZhi-SpotPear/main/blueprints/pixizhi_screens_blueprint.yaml
  author: PixiZhi SpotPear contributors
  input:
    control_interface:
      name: Pixel control interface
      icon: mdi:gesture-tap
      collapsed: true
      input:
        navigation_mode:
          name: Swipe behavior
          description: Built-in navigation is recommended. Additional actions run alongside navigation. Custom replaces navigation; disabled still reports gestures.
          default: builtin
          selector:
            select:
              options:
                - label: Built-in navigation
                  value: builtin
                - label: Built-in plus custom actions
                  value: additional
                - label: Custom actions only
                  value: custom
                - label: Disabled (report only)
                  value: disabled
        music_volume_limit:
          name: Maximum volume from the dial
          default: 65
          selector:
            number:
              min: 5
              max: 100
              unit_of_measurement: "%"
              mode: slider
        screen_labels:
          name: Optional short names, in screen order
          description: Comma-separated names matching your selected screens. Blank positions use the HA friendly name. Example Living, Bedroom, Music, Living heat, Bedroom heat.
          default: ""
          selector:
            text: {}
    screens:
      name: Favorite controls (up to 6, in order)
      selector:
        entity:
          multiple: true
          filter:
            - domain:
                - light
                - switch
                - media_player
                - climate
    standby_temperature:
      name: Standby temperature sensor
      description: Shown below the clock when music is not playing or main-clock music information is disabled.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    standby_humidity:
      name: Standby humidity sensor
      description: Shown alongside temperature when music is not playing.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: humidity
    show_standby_music:
      name: Show music information on the main clock
      description: When enabled, playing music replaces temperature/humidity and uses the selected Clock Color. Disable to keep climate readings on the matrix clock during playback.
      default: true
      selector:
        boolean: {}
    standby_player:
      name: Standby music player
      description: Player shown below the clock. Requires the matching updated PixiZhi SpotPear firmware.
      selector:
        entity:
          filter:
            - domain: media_player
    banner_players:
      name: Now playing banner players (most important first)
      description: >-
        The song-change banner follows the first of these that is playing. Leave
        empty to use the standby music player. The ball's own Sendspin stream is
        used when none of them plays.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    weather:
      name: Weather (standby screen)
      selector:
        entity:
          filter:
            - domain: weather
    standby_status:
      name: Standby weather and status line
      description: >-
        Weather alternates with active status slots on the matrix clock.
        Each slot uses the first selected entity (leave empty to disable).
        Statuses update when their entity changes. Use short ASCII labels, up to 12 characters.
      icon: mdi:dots-horizontal
      collapsed: true
      input:
        status_interval:
          name: Seconds per weather/status item
          default: 5
          selector:
            number:
              min: 3
              max: 15
              mode: slider
        weather_animation:
          name: Occasional weather pixel animation
          description: Brief animation every 90 seconds while weather is visible; disabled at night.
          default: true
          selector:
            boolean: {}
    status_1_section:
      name: Status 1
      icon: mdi:information-outline
      collapsed: true
      input:
        status_1_entity:
          name: Entity to watch (select one, or leave empty)
          default: []
          selector:
            entity:
              multiple: true
        status_1_source:
          name: Match against
          default: state
          selector:
            select:
              options:
                - label: Entity state
                  value: state
                - label: Attribute
                  value: attribute
                - label: State AND attribute
                  value: both
        status_1_attribute:
          name: Attribute name (for attribute matching)
          description: "For example hvac_action, battery_low, or source. Leave empty for state-only matching."
          default: ""
          selector:
            text: {}
        status_1_attribute_values:
          name: Show when attribute equals (comma-separated)
          description: "Exact values; case-insensitive. Use true/false for boolean attributes. Both mode requires state AND attribute to match."
          default: ""
          selector:
            text: {}
        status_1_priority:
          name: Priority (higher appears first)
          default: 0
          selector:
            number:
              min: 0
              max: 10
              mode: box
        status_1_comparison:
          name: Matching rule
          description: Numeric rules apply to the state in State mode, and the selected attribute in Attribute or Both mode. Both also requires the configured state to match.
          default: equals
          selector:
            select:
              options: [equals, above, below]
        status_1_threshold:
          name: Numeric threshold (Above or Below)
          default: 20
          selector:
            number:
              min: -10000
              max: 100000
              step: 0.1
              mode: box
        status_1_show_value:
          name: Show matched value in details
          default: true
          selector:
            boolean: {}
        status_1_target:
          name: Open a configured control on tap (optional)
          description: Entity ID from Favorite controls. Leave blank to run the custom action below.
          default: ""
          selector:
            text: {}
        status_1_tap_action:
          name: Custom tap action
          default: []
          selector:
            action: {}
        status_1_states:
          name: Show when state equals (comma-separated; State or Both mode)
          default: "on,open,playing,home,armed_home,armed_away"
          selector:
            text: {}
        status_1_label:
          name: Short label
          default: "STATUS 1"
          selector:
            text: {}
        status_1_icon:
          name: Pixel icon
          default: alert
          selector:
            select:
              options: [window, door, heating, lock, light, water, music, motion, battery, home, alert]
