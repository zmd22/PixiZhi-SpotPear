    gestures:
      name: Gestures → Actions
      description: >-
        Swipe actions run in Custom or Built-in plus custom mode. Swipe sensors always report. Use built-in navigation for the new pixel interface.
        Circular gestures always adjust screen brightness locally; optional actions
        below run once on release. Existing separate gesture automations will
        still run too, so disable duplicates when moving actions here.
        Long-press requires a stationary 1.4-second hold and Standby Long-press
        set to HA action on the device (Timer mode continues to open the timer).
      icon: mdi:gesture-swipe
      collapsed: true
      input:
        swipe_left_action:
          name: Swipe left
          default: []
          selector:
            action: {}
        swipe_right_action:
          name: Swipe right
          default: []
          selector:
            action: {}
        swipe_up_action:
          name: Swipe up
          default: []
          selector:
            action: {}
        swipe_down_action:
