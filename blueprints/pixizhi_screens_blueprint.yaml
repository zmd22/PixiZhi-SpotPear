    ambient_section:
      name: Auto brightness
      description: >-
        Sends a light sensor's reading to the ball. Turn on "Auto Brightness" in the
        device settings and tune its minimum, maximum and full-brightness lux there.
      icon: mdi:brightness-auto
      collapsed: true
      input:
        ambient_light:
          name: Light sensor
          description: Any sensor reporting illuminance (lx). Leave empty to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance
    plane_section:
      name: What's that plane
      description: >-
        Sends planes from the What's-that-plane integration to the ball. Turn on
        "Plane Spotting" and set "Home Airport" in the device settings to show them.
      icon: mdi:airplane
      collapsed: true
      input:
        plane_sensor:
          name: Visible flights sensor
          description: The sensor created by the What's-that-plane integration. Leave the default if you don't use it.
          default: sensor.visible_flights
          selector:
            entity:
              domain: sensor
    device_name:
      name: ESPHome device name
      description: The name from the firmware (name - substitution), dashes replaced by underscores.
      default: pixizhi
      selector:
        text: {}
    ha_url:
      name: Home Assistant address (for album art)
      description: How the PixiZhi SpotPear reaches Home Assistant, e.g. http://homeassistant.local:8123 (no slash at the end).
      default: http://homeassistant.local:8123
      selector:
        text: {}

mode: parallel
max: 30
max_exceeded: silent

variables:
  navigation_mode: !input navigation_mode
  labels_in: !input screen_labels
  screens_in: !input screens
  standby_temperature: !input standby_temperature
  standby_humidity: !input standby_humidity
  standby_player: !input standby_player
  banner_players: !input banner_players
  weather_ent: !input weather
  node: !input device_name
  plane_sensor: !input plane_sensor
  ambient_light: !input ambient_light
  ha_url: !input ha_url
  batt_min: !input battery_threshold
  status_slots:
    - entities: !input status_1_entity
      states: !input status_1_states
      source: !input status_1_source
      attribute: !input status_1_attribute
      attribute_values: !input status_1_attribute_values
      label: !input status_1_label
      icon: !input status_1_icon
      comparison: !input status_1_comparison
      threshold: !input status_1_threshold
      show_value: !input status_1_show_value
      target: !input status_1_target
      priority: !input status_1_priority
    - entities: !input status_2_entity
      states: !input status_2_states
      source: !input status_2_source
      attribute: !input status_2_attribute
      attribute_values: !input status_2_attribute_values
      label: !input status_2_label
      icon: !input status_2_icon
      comparison: !input status_2_comparison
      threshold: !input status_2_threshold
      show_value: !input status_2_show_value
      target: !input status_2_target
      priority: !input status_2_priority
    - entities: !input status_3_entity
      states: !input status_3_states
      source: !input status_3_source
      attribute: !input status_3_attribute
      attribute_values: !input status_3_attribute_values
      label: !input status_3_label
      icon: !input status_3_icon
      comparison: !input status_3_comparison
      threshold: !input status_3_threshold
      show_value: !input status_3_show_value
      target: !input status_3_target
      priority: !input status_3_priority
    - entities: !input status_4_entity
      states: !input status_4_states
      source: !input status_4_source
      attribute: !input status_4_attribute
      attribute_values: !input status_4_attribute_values
      label: !input status_4_label
      icon: !input status_4_icon
      comparison: !input status_4_comparison
      threshold: !input status_4_threshold
      show_value: !input status_4_show_value
      target: !input status_4_target
      priority: !input status_4_priority
    - entities: !input status_5_entity
      states: !input status_5_states
      source: !input status_5_source
      attribute: !input status_5_attribute
      attribute_values: !input status_5_attribute_values
      label: !input status_5_label
      icon: !input status_5_icon
      comparison: !input status_5_comparison
      threshold: !input status_5_threshold
      show_value: !input status_5_show_value
      target: !input status_5_target
      priority: !input status_5_priority
    - entities: !input status_6_entity
      states: !input status_6_states
      source: !input status_6_source
      attribute: !input status_6_attribute
      attribute_values: !input status_6_attribute_values
      label: !input status_6_label
      icon: !input status_6_icon
      comparison: !input status_6_comparison
      threshold: !input status_6_threshold
      show_value: !input status_6_show_value
      target: !input status_6_target
      priority: !input status_6_priority
  pizza:
    - label: !input pizza_1_label
      icon: !input pizza_1_icon
    - label: !input pizza_2_label
      icon: !input pizza_2_icon
    - label: !input pizza_3_label
      icon: !input pizza_3_icon
    - label: !input pizza_4_label
      icon: !input pizza_4_icon
    - label: !input pizza_5_label
      icon: !input pizza_5_icon
    - label: !input pizza_6_label
      icon: !input pizza_6_icon
    - label: !input pizza_7_label
      icon: !input pizza_7_icon
    - label: !input pizza_8_label
      icon: !input pizza_8_icon
  slots: >-
    {% set s = screens_in if screens_in is list else ([screens_in] if screens_in else []) %}
    {{ s[:6] }}

triggers:
  - trigger: state
    entity_id: !input banner_players
    id: banner
  - trigger: state
    entity_id: !input ambient_light
    id: ambient
  - trigger: state
    entity_id: !input plane_sensor
    id: planes
  - trigger: state
    entity_id: !input status_1_entity
    id: statuses
  - trigger: state
    entity_id: !input status_2_entity
    id: statuses
  - trigger: state
    entity_id: !input status_3_entity
    id: statuses
  - trigger: state
    entity_id: !input status_4_entity
    id: statuses
  - trigger: state
    entity_id: !input status_5_entity
    id: statuses
  - trigger: state
    entity_id: !input status_6_entity
    id: statuses
  - trigger: event
    event_type: esphome.pixizhi_status_tap
    id: status_tap
  - trigger: state
    entity_id: !input standby_temperature
    id: climate
  - trigger: state
    entity_id: !input standby_humidity
    id: climate
  # Light keep-alive every 15 s; everything else is sent when it changes, with a
  # full resync every five minutes as a safety net.
  - trigger: time_pattern
    seconds: "/15"
    id: heartbeat
  - trigger: time_pattern
    minutes: "/5"
    id: statuses
  - trigger: time_pattern
    minutes: "/15"
    id: forecast
  - trigger: event
    event_type: esphome.pixizhi_gesture
    id: gesture
  - trigger: event
    event_type: esphome.pixizhi_rotate
    id: rotation
  - trigger: state
    entity_id: !input standby_player
    id: standby_player
  - trigger: state
    entity_id: !input screens
    id: changed
  - trigger: state
    entity_id: !input weather
    id: weather
  - trigger: event
    event_type: esphome.pixizhi_long_press
    id: long_press
  - trigger: event
    event_type: esphome.pixizhi_pizza
    id: pizza
  - trigger: event
    event_type: esphome.pixizhi_refresh
    id: refresh
  - trigger: homeassistant
    event: start
    id: refresh
  - trigger: event
    event_type: automation_reloaded
    id: refresh

actions:
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'heartbeat' }}"
    then:
      - action: "esphome.{{ node }}_heartbeat"
        continue_on_error: true
      - stop: Heartbeat sent
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['banner', 'refresh'] }}"
    then:
      - variables:
          banner_list: "{{ banner_players if banner_players is list else ([banner_players] if banner_players else []) }}"
          banner_eid: >-
            {% set ns = namespace(p='') %}
            {% for e in banner_list %}
              {% if ns.p == '' and is_state(e, 'playing') and state_attr(e, 'media_title') %}{% set ns.p = e %}{% endif %}
            {% endfor %}
            {{ ns.p }}
      - action: "esphome.{{ node }}_set_banner_source"
        data:
          enabled: "{{ banner_list | count > 0 }}"
          name: "{{ state_attr(banner_eid, 'friendly_name') if banner_eid else '' }}"
          title: "{{ state_attr(banner_eid, 'media_title') if banner_eid else '' }}"
          artist: "{{ (state_attr(banner_eid, 'media_artist') or state_attr(banner_eid, 'media_album_name') or '') if banner_eid else '' }}"
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'banner' }}"
        then:
          - stop: Banner source sent
  - if:
      - condition: template
        value_template: >-
          {{ trigger.id in ['ambient', 'refresh'] and ambient_light not in [none, '', []]
             and states(ambient_light) | is_number }}
    then:
      - action: "esphome.{{ node }}_set_ambient_light"
        data:
          lux: "{{ states(ambient_light) | float }}"
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'ambient' }}"
        then:
          - stop: Ambient light sent
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'ambient' }}"
    then:
      - stop: Ambient light unavailable
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'planes' }}"
    then:
      - variables:
          flights: "{{ state_attr(plane_sensor, 'flights') or [] }}"
      - action: "esphome.{{ node }}_set_planes"
        data:
          models: "{{ flights | map(attribute='aircraft_model') | map('default', '', true) | map('string') | list }}"
          callsigns: "{{ flights | map(attribute='callsign') | map('default', '', true) | map('string') | list }}"
          airlines: "{{ flights | map(attribute='airline_name') | map('default', '', true) | map('string') | list }}"
          origins: "{{ flights | map(attribute='origin_airport_code') | map('default', '', true) | map('string') | list }}"
          destinations: "{{ flights | map(attribute='destination_airport_code') | map('default', '', true) | map('string') | list }}"
          registrations: "{{ flights | map(attribute='aircraft_registration') | map('default', '', true) | map('string') | list }}"
      - stop: Planes sent
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'status_tap' }}"
    then:
      # Only this automation's own device.
      - condition: template
        value_template: "{{ trigger.event.data.get('node', '') | replace('-', '_') == node | replace('-', '_') }}"
      - choose:
          - conditions: "{{ trigger.event.data.get('slot', 0) | int == 1 }}"
            sequence: !input status_1_tap_action
          - conditions: "{{ trigger.event.data.get('slot', 0) | int == 2 }}"
            sequence: !input status_2_tap_action
          - conditions: "{{ trigger.event.data.get('slot', 0) | int == 3 }}"
            sequence: !input status_3_tap_action
          - conditions: "{{ trigger.event.data.get('slot', 0) | int == 4 }}"
            sequence: !input status_4_tap_action
          - conditions: "{{ trigger.event.data.get('slot', 0) | int == 5 }}"
            sequence: !input status_5_tap_action
          - conditions: "{{ trigger.event.data.get('slot', 0) | int == 6 }}"
            sequence: !input status_6_tap_action
      - stop: Status tap handled
  - condition: template
    value_template: >-
      {{ trigger.platform != 'event' or trigger.event.event_type not in
         ['esphome.pixizhi_refresh', 'esphome.pixizhi_gesture', 'esphome.pixizhi_rotate',
          'esphome.pixizhi_long_press', 'esphome.pixizhi_pizza', 'esphome.pixizhi_status_tap'] or
         trigger.event.data.get('node', '') | replace('-', '_') == node | replace('-', '_') }}
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['climate', 'refresh', 'statuses'] }}"
    then:
      - action: "esphome.{{ node }}_set_standby_climate"
        data:
          temperature: "{{ states(standby_temperature) }}"
          humidity: "{{ states(standby_humidity) }}"
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'climate' }}"
        then:
          - stop: Standby climate updated
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['statuses', 'refresh'] }}"
    then:
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'refresh' }}"
        then:
          - action: "esphome.{{ node }}_set_standby_music_options"
            data:
              enabled: !input show_standby_music
          - action: "esphome.{{ node }}_set_control_options"
            data:
              volume_limit: !input music_volume_limit
              gesture_mode: "{{ {'builtin': 0, 'custom': 1, 'disabled': 2, 'additional': 3}.get(navigation_mode, 0) }}"
          - action: "esphome.{{ node }}_set_standby_options"
            data:
              seconds: !input status_interval
              animate: !input weather_animation
      - repeat:
          for_each: "{{ status_slots }}"
          sequence:
            - variables:
                ent: "{{ repeat.item.entities[0] if repeat.item.entities | count > 0 else '' }}"
                active_states: "{{ repeat.item.states.split(',') | map('trim') | list }}"
            - action: "esphome.{{ node }}_set_status"
              data:
                slot: "{{ repeat.index - 1 }}"
                label: "{{ repeat.item.label[:12] }}"
                icon: "{{ repeat.item.icon }}"
                active: >-
                  {% set mode = repeat.item.source %}
                  {% set attr = repeat.item.attribute | trim %}
                  {% set state_ok = states(ent) | lower in (active_states | map('lower') | list) %}
                  {% set allowed = repeat.item.attribute_values.split(',') | map('trim') | map('lower') | reject('eq', '') | list %}
                  {% set value = state_attr(ent, attr) if ent and attr else none %}
                  {% set comparison = repeat.item.comparison %}
                  {% set threshold = repeat.item.threshold | float %}
                  {% set attr_ok = attr != '' and value is not none and (value | string | lower) in allowed %}
                  {% if comparison != 'equals' %}
                    {% set candidate = states(ent) if mode == 'state' else value %}
                    {% set numeric_ok = is_number(candidate) and ((candidate | float > threshold) if comparison == 'above' else (candidate | float < threshold)) %}
                    {% if mode == 'state' %}{% set state_ok = numeric_ok %}{% else %}{% set attr_ok = attr != '' and numeric_ok %}{% endif %}
                  {% endif %}
                  {{ ent != '' and states(ent) not in ['unknown', 'unavailable'] and
                     ((mode == 'state' and state_ok) or (mode == 'attribute' and attr_ok) or
                      (mode == 'both' and state_ok and attr_ok)) }}
            - action: "esphome.{{ node }}_set_status_detail"
              data:
                slot: "{{ repeat.index - 1 }}"
                target: "{{ repeat.item.target | trim }}"
                priority: "{{ repeat.item.priority }}"
                value: >-
                  {% set value = states(ent) if repeat.item.source == 'state' else state_attr(ent, repeat.item.attribute | trim) %}
                  {{ ((value | string) ~ (' ' ~ (state_attr(ent, 'unit_of_measurement') or '') if repeat.item.source == 'state' else ''))[:80] if repeat.item.show_value and ent and value is not none else '' }}
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['gesture', 'rotation'] }}"
    then:
      - condition: template
        value_template: "{{ trigger.event.data.get('node', '') | replace('-', '_') == node | replace('-', '_') }}"
      - condition: template
        value_template: "{{ trigger.id == 'rotation' or navigation_mode in ['custom', 'additional'] }}"
      - choose:
          - conditions: "{{ trigger.event.data.get('gesture', '') == 'swipe_left' }}"
            sequence: !input swipe_left_action
          - conditions: "{{ trigger.event.data.get('gesture', '') == 'swipe_right' }}"
            sequence: !input swipe_right_action
          - conditions: "{{ trigger.event.data.get('gesture', '') == 'swipe_up' }}"
            sequence: !input swipe_up_action
          - conditions: "{{ trigger.event.data.get('gesture', '') == 'swipe_down' }}"
            sequence: !input swipe_down_action
          - conditions: "{{ trigger.event.data.get('direction', '') == 'clockwise' }}"
            sequence: !input clockwise_action
          - conditions: "{{ trigger.event.data.get('direction', '') == 'counterclockwise' }}"
            sequence: !input counterclockwise_action
      - stop: Gesture handled
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'long_press' }}"
    then:
      - sequence: !input long_press_action
      - stop: Long press handled
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'pizza' }}"
    then:
      - choose:
          - conditions: "{{ trigger.event.data.slice | int(0) == 1 }}"
            sequence: !input pizza_1_action
          - conditions: "{{ trigger.event.data.slice | int(0) == 2 }}"
            sequence: !input pizza_2_action
          - conditions: "{{ trigger.event.data.slice | int(0) == 3 }}"
            sequence: !input pizza_3_action
          - conditions: "{{ trigger.event.data.slice | int(0) == 4 }}"
            sequence: !input pizza_4_action
          - conditions: "{{ trigger.event.data.slice | int(0) == 5 }}"
            sequence: !input pizza_5_action
          - conditions: "{{ trigger.event.data.slice | int(0) == 6 }}"
            sequence: !input pizza_6_action
          - conditions: "{{ trigger.event.data.slice | int(0) == 7 }}"
            sequence: !input pizza_7_action
          - conditions: "{{ trigger.event.data.slice | int(0) == 8 }}"
            sequence: !input pizza_8_action
      - stop: Pizza slice handled
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['standby_player', 'refresh', 'statuses'] }}"
    then:
      - action: "esphome.{{ node }}_set_standby_player"
        data:
          eid: "{{ standby_player }}"
          state: "{{ states(standby_player) }}"
          title: "{{ state_attr(standby_player, 'media_title') or '' }}"
          artist: "{{ state_attr(standby_player, 'media_artist') or state_attr(standby_player, 'media_album_name') or '' }}"
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'standby_player' }}"
    then:
      - stop: Standby player updated
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'refresh' }}"
    then:
      - repeat:
          for_each: "{{ pizza }}"
          sequence:
            - action: "esphome.{{ node }}_set_pizza"
              data:
                slice: "{{ repeat.index }}"
                label: "{{ repeat.item.label }}"
                icon: "{{ repeat.item.icon }}"
  - if:
      - condition: template
        value_template: >-
          {{ trigger.id in ['weather', 'refresh', 'forecast'] and weather_ent not in [none, '', []]
             and (state_attr(weather_ent, 'supported_features') | int(0)) // 2 % 2 == 1 }}
    then:
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: "{{ weather_ent }}"
        data:
          type: hourly
        response_variable: hourly
      - variables:
          hours: >-
            {{ ((hourly[weather_ent].forecast if hourly is defined and weather_ent in hourly else [])
               | selectattr('datetime', 'defined') | list)[:5] }}
      - action: "esphome.{{ node }}_set_forecast"
        data:
          hours: "{{ hours | map(attribute='datetime') | map('as_datetime') | map('as_local') | map(attribute='hour') | list }}"
          temps: "{{ hours | map(attribute='temperature') | map('float', 0) | list }}"
          conditions: "{{ hours | map(attribute='condition') | map('default', '', true) | map('string') | list }}"
          rain: "{{ hours | map(attribute='precipitation_probability') | map('default', 0, true) | map('int', 0) | list }}"
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'forecast' }}"
    then:
      - stop: Forecast only
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['weather', 'refresh', 'statuses'] }}"
    then:
      - action: "esphome.{{ node }}_set_weather"
        data:
          temp: "{{ state_attr(weather_ent, 'temperature') | float(0) }}"
          unit: "{{ state_attr(weather_ent, 'temperature_unit') or '' }}"
          condition: "{{ states(weather_ent) if is_number(state_attr(weather_ent, 'temperature')) else 'unavailable' }}"
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'weather' }}"
    then:
      - stop: Weather only
  - variables:
      targets: >-
        {% set ns = namespace(t=[]) %}
        {% if trigger.id == 'changed' %}
          {% for i in range(slots | count) %}
            {% if slots[i] == trigger.entity_id %}{% set ns.t = ns.t + [i] %}{% endif %}
          {% endfor %}
        {% else %}
          {% set ns.t = range(6) | list %}
        {% endif %}
        {{ ns.t }}
  - repeat:
      for_each: "{{ targets }}"
      sequence:
        - variables:
            i: "{{ repeat.item | int }}"
            ent: "{{ slots[i] if i < (slots | count) else '' }}"
        - if:
            - condition: template
              value_template: "{{ ent == '' }}"
          then:
            - action: "esphome.{{ node }}_clear_slot"
              data:
                slot: "{{ i }}"
          else:
            - action: "esphome.{{ node }}_set_slot"
              data:
                slot: "{{ i }}"
                eid: "{{ ent }}"
                label: >-
                  {% set labels = labels_in.split(',') | map('trim') | list %}
                  {{ labels[i] if i < labels | count and labels[i] else state_attr(ent, 'friendly_name') or ent }}
                state: "{{ states(ent) }}"
                dimmable: >-
                  {{ (state_attr(ent, 'supported_color_modes') or []) | select('in', ['brightness', 'color_temp', 'hs', 'rgb', 'rgbw', 'rgbww', 'xy', 'white']) | list | count > 0 }}
                brightness: "{{ state_attr(ent, 'brightness') | int(0) }}"
                color: >-
                  {% set c = state_attr(ent, 'rgb_color') %}
                  {% if c %}{{ (c[0] | int) * 65536 + (c[1] | int) * 256 + (c[2] | int) }}{% else %}16762998{% endif %}
                color_capable: >-
                  {{ (state_attr(ent, 'supported_color_modes') or []) | select('in', ['hs', 'rgb', 'rgbw', 'rgbww', 'xy']) | list | count > 0 }}
                title: "{{ state_attr(ent, 'media_title') or '' }}"
                artist: "{{ state_attr(ent, 'media_artist') or state_attr(ent, 'media_album_name') or '' }}"
                volume: "{{ state_attr(ent, 'volume_level') | float(0) }}"
                picture: >-
                  {% set p = state_attr(ent, 'entity_picture') %}
                  {% if p %}{{ p if p.startswith('http') else ha_url ~ p }}{% endif %}
                temp_now: "{{ state_attr(ent, 'current_temperature') | float(-999) }}"
                temp_target: "{{ state_attr(ent, 'temperature') | float(0) }}"
                temp_min: "{{ state_attr(ent, 'min_temp') | float(5) }}"
                temp_max: "{{ state_attr(ent, 'max_temp') | float(30) }}"
                hvac_action: "{{ state_attr(ent, 'hvac_action') or '' }}"
                battery_low: >-
                  {% set b = state_attr(ent, 'battery') %}
                  {% if b is none %}{% set b = states('sensor.' ~ ent.split('.')[1] ~ '_battery') %}{% endif %}
                  {{ ent.startswith('climate.') and (b | float(100)) < (batt_min | float(20)) }}
            - action: "esphome.{{ node }}_set_slot_features"
              data:
                slot: "{{ i }}"
                step: "{{ state_attr(ent, 'target_temp_step') | float(0.5) }}"
                features: "{{ state_attr(ent, 'supported_features') | int(0) }}"
                white: "{{ 'color_temp' in (state_attr(ent, 'supported_color_modes') or []) }}"
                kelvin_min: "{{ state_attr(ent, 'min_color_temp_kelvin') | int(2000) }}"
                kelvin_max: "{{ state_attr(ent, 'max_color_temp_kelvin') | int(6500) }}"
                modes: "{{ (state_attr(ent, 'hvac_modes') or []) | join('|') }}"
                presets: "{{ (state_attr(ent, 'preset_modes') or []) | join('|') }}"
                unit: "{{ state_attr(ent, 'temperature_unit') or state_attr(ent, 'unit_of_measurement') or '°C' }}"
                sources: "{{ (state_attr(ent, 'source_list') or []) | join('|') }}"
                repeat: "{{ state_attr(ent, 'repeat') or 'off' }}"
                muted: "{{ state_attr(ent, 'is_volume_muted') | default(false, true) }}"
                shuffle: "{{ state_attr(ent, 'shuffle') | default(false, true) }}"