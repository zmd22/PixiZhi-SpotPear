    initial_value: "0"
  - id: gs_target_brightness
    type: float
    initial_value: "1.0"
  - id: gs_base_brightness
    type: float
    initial_value: "1.0"
  - id: gs_last_apply
    type: uint32_t
    initial_value: "0"
  - id: gs_max_move
    type: int
    initial_value: "0"
  - id: gs_touch_id
    type: int
    initial_value: "-1"
  # swipe detector
  - id: gs_clock_origin
    type: bool
    initial_value: "false"
  - id: gs_touch_active
    type: bool
    initial_value: "false"
  - id: gs_start_x
    type: int
    initial_value: "0"
  - id: gs_start_y
    type: int
    initial_value: "0"
  - id: gs_last_x
    type: int
    initial_value: "0"
  - id: gs_last_y
    type: int
    initial_value: "0"
  - id: gs_start_ms
    type: uint32_t
    initial_value: "0"

# --- DEEP STANDBY ---------------------------------------------------------------
# The touch controller pulls its interrupt line low on a touch, which wakes the chip.
deep_sleep:
  id: deep_standby
  wakeup_pin:
    number: GPIO12
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

# --- BUSES --------------------------------------------------------------------
i2c:
  - id: bus_a
    sda: 15
    scl: 14
    scan: false
  - id: bus_b
    sda: 11
    scl: 7
    scan: false

spi:
  - id: spi_bus
    clk_pin: GPIO4
    mosi_pin: GPIO2

# --- AUDIO / SENDSPIN: runtime internal/USB output selection -------------------
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

audio_dac:
  - platform: es8311
    i2c_id: bus_a
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000

speaker:
  - platform: i2s_audio
    id: internal_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    buffer_duration: 100ms
  - platform: usb_audio
    id: usb_speaker
    software_volume: true
    usb_audio_id: usb_audio_bus
    sample_rate: 48000
    bits_per_sample: 16bit
    num_channels: 2
    buffer_size: 6400
  - platform: router
    id: box_speaker
    output_speakers:
      - internal_speaker
      - usb_speaker
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 2

  # Normalize channels and sample width before the fixed-format output router.
  # Two real inputs serve media playback and independent HA announcements.
  - platform: mixer
    id: playback_mixer
    output_speaker: box_speaker
    num_channels: 2
    bits_per_sample: 16
    source_speakers:
      - id: media_mixer_input
        sample_rate: 48000
        num_channels: 2
        bits_per_sample: 16
        buffer_duration: 100ms
      - id: announcement_mixer_input
        sample_rate: 48000
        num_channels: 2
        bits_per_sample: 16
        buffer_duration: 100ms
  # Resamplers normalize rate/width; the mixer above handles channel conversion.
  - platform: resampler
    id: media_resampler
    output_speaker: media_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 100ms
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 100ms

sendspin:
  id: sendspin_hub
  # Encrypted connections alone do not restrict which servers may play.
  unpaired_access: false
  on_display_pairing_code:
    - lambda: |-
        lv_label_set_text(id(pairing_heading), "SENDSPIN PAIR");
        lv_label_set_text(id(pairing_digits), code.c_str());
        lv_label_set_text(id(pairing_hint), "Enter in Music Assistant");
        id(sendspin_pairing_visible) = true;
        id(gs_touch_active) = false;
        id(gs_ring_candidate) = false;
        lv_obj_clear_flag(id(pairing_card), LV_OBJ_FLAG_HIDDEN);
        id(lvgl_comp).set_paused(false, false);
        id(bl_dimmed) = false;
        id(apply_backlight).execute();
  on_clear_pairing_code:
    - lambda: |-
        lv_label_set_text(id(pairing_digits), "");
        lv_obj_add_flag(id(pairing_card), LV_OBJ_FLAG_HIDDEN);
        id(sendspin_pairing_visible) = false;
  on_open_pairing_window:
    - lambda: |-
        lv_label_set_text(id(pairing_heading), "PAIRING WAITING");
        lv_label_set_text(id(pairing_digits), "ALLOW?");
        lv_label_set_text(id(pairing_hint), "Tap ALLOW to retry pairing");
        id(sendspin_pairing_visible) = true;
        id(gs_touch_active) = false;
        id(gs_ring_candidate) = false;
        lv_obj_clear_flag(id(pairing_card), LV_OBJ_FLAG_HIDDEN);
        id(lvgl_comp).set_paused(false, false);
        id(bl_dimmed) = false;
        id(apply_backlight).execute();
  on_close_pairing_window:
    - lambda: |-
        lv_obj_add_flag(id(pairing_card), LV_OBJ_FLAG_HIDDEN);
        id(sendspin_pairing_visible) = false;
  on_pairing_succeeded:
    - logger.log: "Sendspin server paired; trusted access saved"
  on_pairing_failed:
    - logger.log:
        level: WARN
        format: "Sendspin pairing failed: %s"
        args: [reason.c_str()]

# Siren sound, baked into the firmware. Replace the file with any WAV/MP3/FLAC
# of your own (same name), or point "file:" at a URL, then reinstall.
audio_file:
  - id: siren_sound
    file: sounds/alarm.wav
  - id: chime_sound
    file: sounds/chime.wav

media_source:
  - platform: sendspin
    id: sendspin_source
  - platform: audio_file
    id: file_source
  - platform: audio_file
    id: announcement_file_source

media_player:
  - platform: speaker_source
    id: ball_media_player
    name: None
    media_pipeline:
      speaker: media_resampler
      sources:
        - sendspin_source
        - file_source
    announcement_pipeline:
      speaker: announcement_resampler
      sources:
        - announcement_file_source
    on_state:
      - script.execute: audio_display_policy
      - script.execute: update_now_playing

text_sensor:
  - platform: template
    id: timer_ends_sensor
    name: Timer Ends
    icon: mdi:timer-sand
    device_class: timestamp
    update_interval: never
  - platform: template
    id: timer_state_sensor
    name: Timer State
    icon: mdi:timer-outline
    update_interval: never
  - platform: sendspin
    id: sendspin_pairing_code
    name: Sendspin Pairing Code
    type: pairing_code
    entity_category: diagnostic
  - platform: sendspin
    id: np_title
    type: title
    internal: true
    on_value:
      - script.execute: update_now_playing
  - platform: sendspin
    id: np_artist
    type: artist
    internal: true
    on_value:
      - script.execute: update_now_playing

switch:
  # Diagnostic only: the display freezes while local audio is active.
  - platform: template
    id: pause_display_during_audio
    name: Pause Display During Audio
    icon: mdi:monitor-pause
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: audio_display_policy
    on_turn_off:
      - script.execute: audio_display_policy
  - platform: template
    id: usb_audio_fallback
    name: USB Audio Fallback
    icon: mdi:speaker-wireless
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: battery_ring
    name: Battery Ring
    icon: mdi:battery-heart-variant
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: draw_dot_clock
    on_turn_off:
      - script.execute: draw_dot_clock
  - platform: template
    id: night_mode
    name: Night Mode
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: apply_standby_style
    on_turn_off:
      - script.execute: apply_standby_style
  - platform: template
    id: show_pizza
    name: Show Pizza Screen
    icon: mdi:pizza
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: siren
    name: Siren
    icon: mdi:alarm-light
    optimistic: true
    restore_mode: ALWAYS_OFF
    # Runs entirely on the device: the sound is baked into the firmware, and the
    # on-screen STOP works without Home Assistant or a network.
    turn_on_action:
      - if:
          condition:
            lambda: return !id(siren_active);
          then:
            - lambda: |-
                // Remember the volume only on the first start, never the siren's own 100 %.
                id(siren_prev_volume) = id(ball_media_player).volume;
                id(siren_active) = true;
            - script.execute: siren_show
            - script.execute: siren_loop
            - light.turn_on:
                id: led
                brightness: 100%
                red: 100%
                green: 0%
                blue: 0%
                effect: Fast Pulse
      - script.execute: siren_timeout
    turn_off_action:
      - script.stop: siren_timeout
      - script.stop: siren_loop
      - if:
          condition:
            lambda: return id(siren_active);
          then:
            - lambda: id(siren_active) = false;
            - media_player.stop: ball_media_player
            - delay: 150ms
            - script.execute: apply_audio_output
            - script.wait: apply_audio_output
            - media_player.volume_set:
                id: ball_media_player
                volume: !lambda return id(siren_prev_volume);
            - lambda: |-
                lv_obj_add_flag(id(siren_card), LV_OBJ_FLAG_HIDDEN);
                // Hand the LED back to notifications, or switch it off.
                if (id(nq_title).empty()) { auto c = id(led).turn_off(); c.perform(); id(notif_led_on) = false; }
                else { id(notif_led_on) = false; id(notif_led).execute(); }
  # The audio-output selector manages the internal speaker amplifier.
  - platform: gpio
    id: speaker_enable
    internal: true
    pin: GPIO46
    restore_mode: ALWAYS_OFF

# --- SCREEN BACKLIGHT + RGB LED -----------------------------------------------
output:
  - platform: ledc
    pin: 42
    id: backlight_pwm
    inverted: true
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - lambda: |-
          id(bl_requested) = state;
          id(apply_backlight).execute();

light:
  - platform: monochromatic
    id: screen_light
    name: Screen
    icon: mdi:television
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

  - platform: esp32_rmt_led_strip
    id: led
    name: LED
    entity_category: config
    pin: GPIO48
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB
    effects:
      - pulse:
          name: Slow Pulse
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: Fast Pulse
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

select:
  - platform: template
    id: audio_output
    name: Audio Output
    icon: mdi:speaker-multiple
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Internal speaker
    options:
      - Internal speaker
      - USB DAC
    on_value:
      - if:
          condition:
            lambda: return id(ui_ready);
          then:
            - script.execute: apply_audio_output
  - platform: template
    id: clock_color
    name: Clock Color
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Red"
      - "Green"
      - "Amber"
      - "Cyan"
    initial_option: "Amber"
    on_value:
      - script.execute: apply_standby_style
      - script.execute: ui_render
  - platform: template
    id: longpress_mode
    name: Standby Long-press
    icon: mdi:gesture-tap-hold
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "HA action"
      - "Timer"
    initial_option: "HA action"

datetime:
  - platform: template
    id: night_start
    type: time
    name: Night Starts
    icon: mdi:weather-sunset-down
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
    on_value:
      - script.execute: apply_standby_style
  - platform: template
    id: night_end
    type: time
    name: Night Ends
    icon: mdi:weather-sunset-up
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    on_value:
      - script.execute: apply_standby_style

number:
  - platform: template
    id: night_brightness
    name: Night Mode Brightness
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: apply_backlight
  - platform: template
    id: siren_max_duration
    name: Siren Max Duration
    icon: mdi:timer-alert-outline
    entity_category: config
    unit_of_measurement: s
    optimistic: true
    restore_value: true
    initial_value: 120
    min_value: 10
    max_value: 900
    step: 10
    mode: box
  - platform: template
    id: longpress_brightness
    name: Long-press Brightness
    icon: mdi:gesture-tap-hold
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 5
    max_value: 100
    step: 5
    mode: slider
  - platform: template
    id: screen_timeout
    name: Standby After
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 5
    max_value: 600
    step: 5
    mode: box
  - platform: template
    id: low_battery_level
    name: Low Battery Warning
    icon: mdi:battery-alert-variant-outline
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 0
    max_value: 50
    step: 5
    mode: box
    on_value:
      - script.execute: draw_dot_clock
  # 0 disables deep standby. Wakes on touch; HA, music and notifications are
  # offline while asleep. Never sleeps on the charger, while playing, during a
  # running timer, with an urgent alert, or while the siren is on.
  - platform: template
    id: deep_standby_after
    name: Deep Standby After
    icon: mdi:power-sleep
    entity_category: config
    unit_of_measurement: min
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 240
    step: 5
    mode: box
  - platform: template
    id: standby_brightness
    name: Standby Brightness
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    on_value:
      - script.execute: apply_backlight

button:
  - platform: template
    name: Sendspin Allow Pairing Retry
    icon: mdi:shield-key
    entity_category: config
    on_press:
      - sendspin.confirm_pairing_window: sendspin_hub
  - platform: template
    name: Audio Output Test
    icon: mdi:speaker-play
    on_press:
      - media_player.stop: ball_media_player
      - media_player.volume_set:
          id: ball_media_player
          volume: 20%
      - media_player.play_media:
          id: ball_media_player
          media_url: "audio-file://chime_sound"
          announcement: true

  - platform: restart
    name: Restart
    entity_category: config


# --- BATTERY + SWIPE SENSORS --------------------------------------------------
sensor:
  - platform: adc
    pin: GPIO1
    name: Battery Voltage
    id: battery_voltage
    attenuation: 12db
    accuracy_decimals: 2
    update_interval: 10s
    unit_of_measurement: V
    icon: mdi:battery-medium
    entity_category: diagnostic
    filters:
      - multiply: 2.0
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 1
      - throttle: 1min
    on_value:
      - lambda: |-
          // Speaker load sags the cell voltage; keep the last idle reading during playback.
          if (id(audio_busy)()) return;
          id(battery_percentage).publish_state(x);
          // Charging estimate: no charger pin is exposed, so use the idle voltage trend.
          static float history[5] = {0, 0, 0, 0, 0};  // one sample per minute (throttle)
          static int filled = 0;
          for (int i = 4; i > 0; i--) history[i] = history[i - 1];
          history[0] = x;
          if (filled < 5) filled++;
          bool charging = id(battery_charging).state;
          if (x >= 4.17f) charging = true;
          else if (filled == 5 && x - history[4] >= 0.04f) charging = true;
          else if (filled == 5 && history[4] - x >= 0.02f) charging = false;
          else if (x < 4.05f && filled == 5 && x - history[4] < 0.01f) charging = false;
          if (charging != id(battery_charging).state) id(battery_charging).publish_state(charging);
      - script.execute: draw_dot_clock

  - platform: template
    id: battery_percentage
    name: Battery
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 2.80 -> 0.0
            - 3.10 -> 10.0
            - 3.30 -> 20.0
            - 3.45 -> 30.0
            - 3.60 -> 40.0
            - 3.70 -> 50.0
            - 3.75 -> 60.0
            - 3.80 -> 70.0
            - 3.90 -> 80.0
            - 4.00 -> 90.0
            - 4.20 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

binary_sensor:
  - platform: template
    id: battery_charging
    name: Charging (estimated)
    device_class: battery_charging
    entity_category: diagnostic
    on_state:
      - script.execute: draw_dot_clock
  - platform: template
    id: swipe_left
    name: Swipe Left
    icon: mdi:gesture-swipe-left
  - platform: template
    id: swipe_right
    name: Swipe Right
    icon: mdi:gesture-swipe-right
  - platform: template
    id: swipe_up
    name: Swipe Up
    icon: mdi:gesture-swipe-up
  - platform: template
    id: swipe_down
    name: Swipe Down
    icon: mdi:gesture-swipe-down

# --- TOUCH ----------------------------------------------------------------------
touchscreen:
  - platform: cst816
    id: my_touchscreen
    interrupt_pin:
      number: GPIO12
      allow_other_uses: true
    reset_pin: GPIO6
    display: main_display
    i2c_id: bus_b
    on_touch:
      - lambda: |-
          if (id(sendspin_pairing_visible) || id(setup_state)==1 || id(setup_state)==2 || id(siren_active)) return;
          id(gs_touch_active)=true;
          id(ui_touch_view)=id(ui_view);id(ui_touch_slot)=id(cur_slot);id(ui_touch_overlay)=id(overlay);
          id(gs_clock_origin)=id(overlay)==pixizhi::OVERLAY_NONE && id(ui_view)==pixizhi::VIEW_STANDBY && id(cur_slot)<0;
          id(ui_wake_only)=id(bl_dimmed);
          id(gs_start_x)=touch.x;id(gs_start_y)=touch.y;id(gs_last_x)=touch.x;id(gs_last_y)=touch.y;
          id(gs_start_ms)=millis();id(gs_touch_id)=touch.id;id(gs_max_move)=0;
          float rx=touch.x-120.0f,ry=touch.y-120.0f;
          bool dial=id(gs_clock_origin);
          int s=id(cur_slot);
          if(id(ui_view)==pixizhi::VIEW_SLOT && s>=0 && s<6 && id(slot_seen)[s]!=0 && (uint32_t)(millis()-id(slot_seen)[s])<45000 &&
             id(slot_state)[s]!="unknown" && id(slot_state)[s]!="unavailable") {
            auto &e=id(slot_eid)[s];bool music=e.rfind("media_player.",0)==0,climate=e.rfind("climate.",0)==0;
            dial=(music&&(id(slot_features)[s]&4)) || (climate&&(id(slot_features)[s]&1)) || id(slot_dimmable)[s];
            id(ui_dial_base)=music?id(slot_vol)[s]*100:climate?id(slot_ttarget)[s]:id(slot_bri)[s]*100.0f/255;
            int k=id(slot_pending)[s];if(k==2||k==3||k==4)id(ui_dial_base)=id(slot_expected)[s];
            id(ui_dial_value)=id(ui_dial_base);
          }
          // Bottom gap is reserved for navigation and large buttons, not dial capture.
          id(gs_ring_candidate)=!id(ui_wake_only)&&id(overlay)==pixizhi::OVERLAY_NONE&&dial&&rx*rx+ry*ry>=94.0f*94.0f&&!(touch.y>185&&touch.x>70&&touch.x<170);
          id(gs_rotating)=false;id(gs_turn)=0;id(gs_angle)=atan2f(ry,rx);id(gs_last_apply)=0;
          id(gs_base_brightness)=id(is_night)()?id(night_brightness).state/100.0f:id(screen_light).remote_values.get_brightness();id(gs_target_brightness)=id(gs_base_brightness);
          if(id(bl_dimmed)){id(bl_dimmed)=false;id(apply_backlight).execute();}
    on_update:
      - lambda: |-
          if (id(sendspin_pairing_visible) || id(setup_state)==1 || id(setup_state)==2 || id(siren_active)) { id(gs_touch_active)=false; return; }
          if(!id(gs_touch_active))return;
          for(auto &t:touches)if(t.id==id(gs_touch_id)&&t.state>=1&&t.state<=2){
            id(gs_last_x)=t.x;id(gs_last_y)=t.y;
            id(gs_max_move)=std::max(id(gs_max_move),std::max(std::abs((int)t.x-id(gs_start_x)),std::abs((int)t.y-id(gs_start_y))));
            if(id(ui_wake_only)||id(ui_touch_view)!=id(ui_view)||id(ui_touch_slot)!=id(cur_slot)||id(ui_touch_overlay)!=id(overlay)){id(gs_ring_candidate)=false;break;}
            if(id(gs_ring_candidate)){
              float rx=t.x-120.0f,ry=t.y-120.0f;
              if(rx*rx+ry*ry<83.0f*83.0f){id(gs_ring_candidate)=false;break;}
              float angle=atan2f(ry,rx),delta=angle-id(gs_angle);
              if(delta>3.14159265f)delta-=6.2831853f;if(delta< -3.14159265f)delta+=6.2831853f;
              id(gs_angle)=angle;
              if(fabsf(delta)>0.7853982f){id(gs_ring_candidate)=false;break;}
              id(gs_turn)+=delta;
              if(fabsf(id(gs_turn))>=0.174533f)id(gs_rotating)=true;
              if(id(gs_rotating)&&(uint32_t)(millis()-id(gs_last_apply))>=50){id(gs_last_apply)=millis();
                if(id(gs_clock_origin))id(clock_brightness_apply).execute();else id(ui_dial_apply).execute();}
            }break;
          }
    on_release:
      - lambda: |-
          if (id(sendspin_pairing_visible) || id(setup_state)==1 || id(setup_state)==2 || id(siren_active)) { id(gs_touch_active)=false; return; }
          if(!id(gs_touch_active))return;
          id(gs_touch_active)=false;
          if(id(ui_wake_only))return;
          if(id(ui_touch_view)!=id(ui_view)||id(ui_touch_slot)!=id(cur_slot)||id(ui_touch_overlay)!=id(overlay))return;
          if(id(gs_rotating)){
            if(id(gs_clock_origin)){id(clock_brightness_apply).execute();id(report_clock_rotation).execute();}
            else{id(ui_dial_apply).execute();id(ui_dial_commit).execute();}return;
          }
          const int px=id(gs_last_x), py=id(gs_last_y);
          const int dx0=px-id(gs_start_x),dy0=py-id(gs_start_y);
          const uint32_t held_ms=millis()-id(gs_start_ms);
          if(id(overlay)==pixizhi::OVERLAY_NOTIFICATIONS) {
            if(std::abs(dy0)>=30) {id(notification_line)=std::max(0,id(notification_line)+(dy0<0?2:-2));id(ui_render).execute();}
            else if(id(gs_max_move)<=16) id(notif_dismiss).execute(held_ms>=1000);
            return;
          }
          if(id(overlay)==pixizhi::OVERLAY_TIMER) {
            if(id(gs_max_move)>16)return;
            if(py>207){id(ui_home).execute();return;}
            if(py>=170){if(held_ms>=1000)id(timer_reset).execute();else id(timer_main).execute();return;}
            if(py>=122&&py<168&&(px<96||px>144)&&!id(timer_running)&&!id(timer_done)&&id(timer_left)==id(timer_set_min)*60){
              id(timer_set_min)=std::max(1,std::min(60,id(timer_set_min)+(px<120?-1:1)));
              id(timer_left)=id(timer_set_min)*60;id(timer_ui).execute();}return;
          }
          if(id(cur_slot)==pixizhi::SLOT_PIZZA && id(ui_view)==pixizhi::VIEW_STANDBY) {
            if(std::abs(dx0)>=34&&std::abs(dx0)>std::abs(dy0)){
              int pages=id(pizza_page_count)();
              if(pages>1){id(pizza_pg)=(id(pizza_pg)+(dx0<0?1:pages-1))%pages;id(pizza_sel)=-1;id(ui_render).execute();}
              return;
            }
            if(id(gs_max_move)>16)return;
            if(py>207){id(ui_home).execute();return;}
            int dx=px-120,dy=py-120;
            if(std::abs(dx)<30&&std::abs(dy)<30){id(ui_home).execute();return;}
            id(pizza_sel)=std::abs(dy)>=std::abs(dx)?(dy<0?0:2):(dx>0?1:3);
            if(id(pizza_labels)[id(pizza_pg)*pixizhi::PIZZA_PAGE_SIZE+id(pizza_sel)].empty()){id(pizza_sel)=-1;return;}
            id(pizza_fire).execute();id(ui_render).execute();return;
          }
          if((id(ui_view)==pixizhi::VIEW_HEATING_LIST||id(ui_view)==pixizhi::VIEW_CATEGORY_LIST)&&std::abs(dy0)>=30&&std::abs(dy0)>std::abs(dx0)) {
            if(dy0<0)id(pulse_swipe_up).execute();else id(pulse_swipe_down).execute();
            if(id(ui_gesture_mode)==1||id(ui_gesture_mode)==2)return;
            int count=0;for(auto &e:id(slot_eid))if(id(ui_view)==pixizhi::VIEW_HEATING_LIST?e.rfind("climate.",0)==0:id(ui_category)==0?(e.rfind("light.",0)==0||e.rfind("switch.",0)==0):e.rfind("media_player.",0)==0)count++;
            id(ui_list_offset)=std::max(0,std::min(std::max(0,count-2),id(ui_list_offset)+(dy0<0?1:-1)));
            id(ui_scroll_ms)=millis();id(ui_render).execute();return;
          }
          if((id(ui_view)==pixizhi::VIEW_HEATING_LIST||id(ui_view)==pixizhi::VIEW_CATEGORY_LIST)&&std::abs(dx0)>=30&&std::abs(dx0)>std::abs(dy0))return;
          // Existing overlay widgets retain their own buttons. No global gesture click-through.
          if(id(overlay)!=pixizhi::OVERLAY_NONE)return;
          if(id(ui_view)==pixizhi::VIEW_STANDBY && !id(gs_clock_origin))return;
          int dx=id(gs_last_x)-id(gs_start_x),dy=id(gs_last_y)-id(gs_start_y);
          uint32_t dt=millis()-id(gs_start_ms);int ax=std::abs(dx),ay=std::abs(dy);
          bool dashboard=id(ui_view)>0;
          if(dt<=1500&&(ax>=34||ay>=34)){
            // A rejected rim interaction is consumed, never converted into a swipe.
            int rx=id(gs_start_x)-120,ry=id(gs_start_y)-120;
            if(rx*rx+ry*ry>=94*94 && (id(gs_clock_origin)||id(ui_view)==pixizhi::VIEW_SLOT))return;
            if(ax>=ay){if(dx<0)id(pulse_swipe_left).execute();else id(pulse_swipe_right).execute();}
            else{if(dy<0)id(pulse_swipe_up).execute();else id(pulse_swipe_down).execute();}
            if(id(ui_gesture_mode)==1||id(ui_gesture_mode)==2)return;
            int v=id(ui_view);
            if(ax>=ay){
              if(v==5||v==9||v==10){int count=0;
                if(v==5){for(int q=0;q<6;q++){auto &e=id(slot_eid)[q];if(id(ui_category)==0?(e.rfind("light.",0)==0||e.rfind("switch.",0)==0):e.rfind("media_player.",0)==0)count++;}}
                else if(v==9||v==10){int s=id(cur_slot);if(s>=0&&s<6){std::string a=v==9?id(slot_modes)[s]+"|"+id(slot_presets)[s]:id(slot_sources)[s];for(char c:a)if(c=='|')count++;count+=v==9?1:4;}}
                int maxoff=std::max(0,((count-1)/3)*3);id(ui_list_offset)=std::max(0,std::min(maxoff,id(ui_list_offset)+(dx<0?3:-3)));id(ui_render).execute();
              } else if(v==7){int q=id(ui_status_detail);id(ui_status_detail)=(q+(dx<0?1:5))%6;id(ui_render).execute();}
              else if(v==0||v==2)id(ui_cycle).execute(dx<0?1:-1);
            }else if(dy>0)id(ui_back).execute();
            else if(v==0)id(ui_open).execute(pixizhi::VIEW_MORE);
            else if(v==2){int s=id(cur_slot);if(s>=0&&s<6){auto &e=id(slot_eid)[s];if(e.rfind("climate.",0)==0)id(ui_open).execute(pixizhi::VIEW_CLIMATE_MODES);else if(e.rfind("media_player.",0)==0)id(ui_open).execute(pixizhi::VIEW_MUSIC_OPTIONS);else id(ui_colors_open).execute();}}
            return;
          }
          if(id(gs_max_move)>16)return;
          if(dt>=1400&&id(gs_max_move)<=12&&id(gs_clock_origin)){id(standby_long_press).execute();return;}
          if(dt>=600)return;
          if(dashboard){id(ui_tap).execute(id(gs_start_x),id(gs_start_y));return;}
          if(!id(gs_clock_origin))return;
          int x=id(gs_start_x),y=id(gs_start_y);
          if(!id(nq_title).empty()&&y>193){id(open_notifications).execute();return;}
          if(y<76&&id(status_row)>=0){id(ui_status_detail)=id(status_row);id(ui_open).execute(pixizhi::VIEW_STATUS_DETAIL);return;}
          if(y>=155&&id(standby_music_enabled)&&id(standby_state)=="playing"){
            for(int q=0;q<6;q++)if(id(slot_eid)[q]==id(standby_player)){id(cur_slot)=q;id(show_current).execute();return;}
            id(ui_category_open).execute(1);return;
          }
          id(ui_open).execute(pixizhi::VIEW_MENU);

# --- DISPLAY ------------------------------------------------------------------
display:
  - platform: mipi_spi
    id: main_display
    model: GC9A01A
    # Shorten synchronous display transfers (previous default: 10 MHz).
    data_rate: 40MHz
    invert_colors: true
    cs_pin: GPIO5
    dc_pin: GPIO47
    reset_pin: GPIO38
    update_interval: never
    auto_clear_enabled: false

# --- FONTS ----------------------------------------------------------------------
font:
  - file: fonts/pixizhi-pixel.ttf
    id: pixel_small
    size: 10
    bpp: 1
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
  - file: fonts/pixizhi-pixel.ttf
    id: pixel_medium
    size: 20
    bpp: 1
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
  - file: fonts/pixizhi-pixel.ttf
    id: pixel_large
    size: 40
    bpp: 1
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

# --- SCRIPTS --------------------------------------------------------------------
script:
  - id: apply_audio_output
    mode: restart
    then:
      - switch.turn_off: speaker_enable
      - if:
          condition:
            # The siren always uses the built-in speaker, whatever output is selected.
            lambda: return id(audio_output).active_index().value_or(0) == 1 && !id(siren_active);
          then:
            - router.speaker.switch_output:
                id: box_speaker
                target_speaker: usb_speaker
          else:
            - router.speaker.switch_output:
                id: box_speaker
                target_speaker: internal_speaker
            - delay: 100ms
            - switch.turn_on: speaker_enable
  - id: ui_open
    parameters:
      view: int
    then:
      - lambda: |-
          id(overlay) = pixizhi::OVERLAY_NONE;
          id(ui_view) = view;
          id(ui_list_offset) = 0;
          id(ui_scroll_ms) = millis();
          id(ui_scroll_tick) = -1;
      - lvgl.page.show: dashboard_page
      - script.execute: ui_render
  - id: ui_home
    then:
      - lambda: id(cur_slot) = -1; id(pizza_pg) = 0;
      - script.execute: show_current
  - id: ui_back
    then:
      - lambda: |-
          if(id(overlay)!=pixizhi::OVERLAY_NONE || id(ui_view)==pixizhi::VIEW_MENU) {id(ui_home).execute();return;}
          if(id(ui_view)==8 || id(ui_view)==pixizhi::VIEW_CLIMATE_MODES || id(ui_view)==pixizhi::VIEW_MUSIC_OPTIONS) {id(ui_open).execute(pixizhi::VIEW_SLOT);return;}
          id(ui_open).execute(pixizhi::VIEW_MENU);
  - id: ui_category_open
    parameters:
      category: int
    then:
      - lambda: |-
          id(ui_category)=category;
          if(category==2){id(ui_open).execute(pixizhi::VIEW_HEATING_LIST);return;}
          int count=0,first=-1;
          for(int i=0;i<6;i++) {
            auto &e=id(slot_eid)[i];
            bool match=category==0?(e.rfind("light.",0)==0||e.rfind("switch.",0)==0):e.rfind("media_player.",0)==0;
            if(match){count++;if(first<0)first=i;}
          }
          if(count==1){id(cur_slot)=first;id(show_current).execute();}
          else id(ui_open).execute(pixizhi::VIEW_CATEGORY_LIST);
  - id: ui_cycle
    parameters:
      direction: int
    then:
      - lambda: |-
          std::vector<int> slots;
          for(int i=0;i<6;i++)if(!id(slot_eid)[i].empty())slots.push_back(i);
          if(slots.empty()){id(ui_open).execute(pixizhi::VIEW_MENU);return;}
          int pos=-1;for(int i=0;i<(int)slots.size();i++)if(slots[i]==id(cur_slot))pos=i;
          pos=pos<0?(direction>0?0:slots.size()-1):(pos+direction+slots.size())%slots.size();
          id(cur_slot)=slots[pos];id(show_current).execute();
  - id: ui_command
    mode: parallel
    max_runs: 8
    parameters:
      slot: int
      kind: int
      value: float
      option: string
    then:
      - if:
          condition:
            lambda: |-
              return id(ha_online)() && slot>=0 && slot<6 && !id(slot_eid)[slot].empty() && id(slot_seen)[slot]!=0 &&
                (uint32_t)(millis()-id(slot_seen)[slot])<45000 &&
                id(slot_state)[slot]!="unavailable" && id(slot_state)[slot]!="unknown";
          then:
            - lambda: |-
                if(kind<=7) {id(slot_pending)[slot]=kind;id(slot_expected)[slot]=value;id(slot_command_ms)[slot]=millis();}
                id(ui_message)="SENDING";id(ui_message_until)=millis()+900;
            - if:
                condition:
                  lambda: return kind==1;
                then:
                  - homeassistant.action:
                      action: !lambda return std::string(value>0?"homeassistant.turn_on":"homeassistant.turn_off");
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
            - if:
                condition:
                  lambda: return kind==2;
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        brightness_pct: !lambda return esphome::to_string((int)roundf(fmaxf(1,fminf(100,value))));
            - if:
                condition:
                  lambda: return kind==3;
                then:
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        volume_level: !lambda return esphome::to_string(fmaxf(0,fminf(id(ui_volume_limit),value))/100.0f);
            - if:
                condition:
                  lambda: return kind==4;
                then:
                  - homeassistant.action:
                      action: climate.set_temperature
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        temperature: !lambda return esphome::to_string(value);
            - if:
                condition:
                  lambda: return kind==5;
                then:
                  - homeassistant.action:
                      action: !lambda return std::string(value>0?"media_player.media_play":"media_player.media_pause");
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
            - if:
                condition:
                  lambda: return kind==6 || kind==9;
                then:
                  - homeassistant.action:
                      action: climate.set_hvac_mode
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        hvac_mode: !lambda return option;
            - if:
                condition:
                  lambda: return kind==7 && id(slot_color_capable)[slot];
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                      data_template:
                        rgb_color: "{{ [red, green, blue] }}"
                      variables:
                        red: !lambda return (static_cast<int>(value)>>16)&255;
                        green: !lambda return (static_cast<int>(value)>>8)&255;
                        blue: !lambda return static_cast<int>(value)&255;
            - if:
                condition:
                  lambda: return kind==8 && id(slot_white)[slot];
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        color_temp_kelvin: !lambda return esphome::to_string((int)value);
            - if:
                condition:
                  lambda: return kind==10;
                then:
                  - homeassistant.action:
                      action: climate.set_preset_mode
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        preset_mode: !lambda return option;
            - if:
                condition:
                  lambda: return kind==11;
                then:
                  - homeassistant.action:
                      action: !lambda return "media_player."+option;
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
            - if:
                condition:
                  lambda: return kind==12;
                then:
                  - homeassistant.action:
                      action: media_player.volume_mute
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        is_volume_muted: !lambda return value>0?"true":"false";
            - if:
                condition:
                  lambda: return kind==13;
                then:
                  - homeassistant.action:
                      action: media_player.shuffle_set
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        shuffle: !lambda return value>0?"true":"false";
            - if:
                condition:
                  lambda: return kind==14;
                then:
                  - homeassistant.action:
                      action: media_player.repeat_set
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        repeat: !lambda return option;
            - if:
                condition:
                  lambda: return kind==15;
                then:
                  - homeassistant.action:
                      action: media_player.select_source
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
