                      text_font: pixel_small
                on_click:
                  - sendspin.confirm_pairing_window: sendspin_hub
            - button:
                align: CENTER
                x: 46
                y: 74
                width: 80
                height: 34
                radius: 17
                bg_color: 0x303030
                widgets:
                  - label:
                      align: CENTER
