                text_align: CENTER
                text: "Scan to join PixiZhi Setup, then choose your Wi-Fi"
                text_font: pixel_small
                text_color: 0xC0C0C0
            - button:
                id: setup_hide
                align: CENTER
                y: 92
                width: 80
                height: 30
                radius: 15
                bg_color: 0x303030
                hidden: true
                widgets:
                  - label:
                      align: CENTER
