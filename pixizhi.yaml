    initial_value: 'std::vector<int>(6, 0)'
  - id: slot_expected
    type: std::vector<float>
    initial_value: 'std::vector<float>(6, 0)'
  - id: slot_command_ms
    type: std::vector<uint32_t>
    initial_value: 'std::vector<uint32_t>(6, 0)'
  - id: slot_seen
    type: std::vector<uint32_t>
    initial_value: 'std::vector<uint32_t>(6, 0)'
  - id: status_value
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(6, "")'
  - id: status_target
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(6, "")'
  - id: desk_temp
    type: std::string
    initial_value: '""'
  - id: desk_rh
    type: std::string
    initial_value: '""'
  - id: status_labels
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(6)'
  - id: status_icons
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(6)'
  - id: status_active
