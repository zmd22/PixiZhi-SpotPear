  - id: clock_brightness_apply
    then:
      - lambda: |-
          // Three quarters of a turn spans the full brightness range.
          float value = id(gs_base_brightness) + id(gs_turn) / 4.712389f;
          value = fmaxf(0.05f, fminf(1.0f, value));
          id(gs_target_brightness) = value;
          if(id(is_night)()) {id(backlight_pwm).set_level(value);} else {
          auto call = id(screen_light).turn_on();
          call.set_brightness(value);
          call.set_transition_length(0);
          call.set_publish(false);  // Publish once on release, not every touch sample.
          call.set_save(false);
          call.perform();
          }
          id(clock_brightness_until) = millis()+1200;
          id(draw_dot_clock).execute();
      - script.execute: clock_brightness_hide
  - id: clock_brightness_hide
    mode: restart
    then:
      - delay: 1200ms
      - lambda: id(clock_brightness_until) = 0;
      - script.execute: draw_dot_clock
  - id: report_clock_rotation
    then:
      - lambda: |-
          if(id(is_night)()){auto night_call=id(night_brightness).make_call();night_call.set_value(id(gs_target_brightness)*100);night_call.perform();}
          else {
          auto call = id(screen_light).turn_on();
          // Commit the actual gesture result, never the previously published HA value.
          call.set_brightness(id(gs_target_brightness));
          call.set_publish(true);
          call.set_save(true);
          call.set_transition_length(0);
          call.perform();
          }
      - homeassistant.event:
          event: esphome.pixizhi_rotate
          data:
            node: ${name}
            direction: !lambda |-
              return std::string(id(gs_turn) >= 0 ? "clockwise" : "counterclockwise");
            brightness: !lambda return esphome::to_string((int) roundf(id(gs_target_brightness) * 100));
