# =============================================================================
#  PixiZhi SpotPear 1.1.0 - Home Assistant remote for the XiaoZhi Spotpear ball (Ball v2)
#  Standby clock + up to 6 light / media player / thermostat screens picked in
#  Home Assistant, pizza button screen, notification center, kitchen timer,
#  pixel clock, Sendspin speaker, siren, LED notifications,
#  USB host audio (Bluetooth disabled), screen + LED controls, battery, swipe sensors
#  Hardware definitions based on RealDeco/xiaozhi-esphome (ball_v2_hw.yaml)
# =============================================================================

substitutions:
  # GitHub repository that publishes firmware releases (owner/name).
  github_repo: zmd22/PixiZhi-SpotPear
  name: pixizhi
  friendly_name: PixiZhi SpotPear

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: pixizhi.spotpear
    version: "1.1.0"
  min_version: 2026.11.0-dev
  name_add_mac_suffix: false
  includes:
    - pixizhi_ui.h
    - pixizhi_draw.h
  on_boot:
    priority: -100
    then:
      - lambda: id(ui_ready) = true;
      - script.execute: nq_restore
      - script.execute: timer_restore
      - script.execute: timer_publish
      - script.execute: draw_wheel
      - script.execute: update_clock
      - script.execute: apply_standby_style
      - script.execute: show_current
      - script.execute: apply_audio_output

# ESPHome "Take control" creates a small local config that pulls this file, the
# header, components, fonts and sounds from GitHub as a package.
dashboard_import:
  package_import_url: github://${github_repo}/pixizhi.yaml@main
  import_full_config: false

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

# USB is reserved for host audio. View logs wirelessly, not through USB serial.
logger:
  level: INFO
  hardware_uart: UART0
  baud_rate: 0

# Public firmware contains no credentials. Without saved Wi-Fi the device opens
# the "PixiZhi Setup" hotspot and shows a QR code; the captive portal stores the
# network on the device, where it survives every update.
wifi:
  ap:
    ssid: PixiZhi Setup
    ap_timeout: 2min

captive_portal:

# No network-push OTA: a password in public firmware would not be secret.
# Updates are pulled from GitHub releases and checked against the manifest MD5
# over verified HTTPS. USB flashing always remains possible.
ota:
  - platform: http_request
    on_begin:
      - lambda: |-
          id(media_player_stop_for_update).execute();
          lv_label_set_text(id(update_pct), "0%");
          lv_bar_set_value(id(update_bar), 0, LV_ANIM_OFF);
          lv_label_set_text(id(update_note), "Keep powered");
          lv_obj_clear_flag(id(update_card), LV_OBJ_FLAG_HIDDEN);
          id(lvgl_comp).set_paused(false, false);
          id(bl_dimmed) = false;
          id(apply_backlight).execute();
          lv_refr_now(nullptr);
    on_progress:
      - lambda: |-
          static int last = -1;
          int p = (int) x;
          if (p == last) return;
          last = p;
          lv_label_set_text(id(update_pct), (esphome::to_string(p) + "%").c_str());
          lv_bar_set_value(id(update_bar), p, LV_ANIM_OFF);
          // The download runs inside the main loop; draw the frame now.
          lv_refr_now(nullptr);
    on_end:
      - lambda: |-
          lv_label_set_text(id(update_pct), "100%");
          lv_bar_set_value(id(update_bar), 100, LV_ANIM_OFF);
          lv_label_set_text(id(update_note), "Restarting");
          lv_refr_now(nullptr);
    on_error:
      - lambda: |-
          lv_label_set_text(id(update_pct), "FAILED");
          lv_label_set_text(id(update_note), "Old firmware kept");
          lv_refr_now(nullptr);
      - delay: 5s
      - lambda: lv_obj_add_flag(id(update_card), LV_OBJ_FLAG_HIDDEN);

# A new image must run for two minutes before it is confirmed. If it crashes or
# resets before then, the bootloader rolls back to the previous firmware
# automatically (ESP-IDF app rollback, enabled by safe_mode + OTA).
safe_mode:
  boot_is_good_after: 2min
  num_attempts: 5

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    source: https://github.com/${github_repo}/releases/latest/download/manifest.json
    update_interval: 6h

# Bluetooth proxy and BLE scanning are removed to free resources for USB audio.
# The USB-C connection is now a host data port for an external USB DAC/speaker.
usb_host:
  enable_hubs: true

# Keep the bundled components folder next to this YAML.
external_components:
  - source:
      type: local
      path: components
    components: [usb_audio]

usb_audio:
  id: usb_audio_bus

http_request:
  verify_ssl: true
  useragent: PixiZhi-SpotPear
  timeout: 10s

# Encryption without a compiled key: Home Assistant generates and stores a key
# for this device when it is added, so every installation has its own key.
api:
  encryption: {}
  on_client_disconnected:
    - script.execute: link_changed
  on_client_connected:
    - lambda: id(ha_adopted) = true;
    - script.execute: setup_card_update
    - script.execute: link_changed
    - delay: 3s
    - homeassistant.event:
        event: esphome.pixizhi_refresh
        data:
          node: ${name}
  actions:
    - action: set_standby_music_options
      variables:
        enabled: bool
      then:
        - lambda: id(standby_music_enabled) = enabled;
        - script.execute: update_clock
        - script.execute: update_now_playing
    - action: set_control_options
      variables:
        volume_limit: int
        gesture_mode: int
      then:
        - lambda: |-
            id(ui_volume_limit) = std::max(5, std::min(100, static_cast<int>(volume_limit)));
            id(ui_gesture_mode) = std::max(0, std::min(3, static_cast<int>(gesture_mode)));
            id(ui_last_sync) = millis();
        - script.execute: ui_render
    - action: set_slot_features
      variables:
        slot: int
        step: float
        features: int
        white: bool
        kelvin_min: int
        kelvin_max: int
        modes: string
        presets: string
        unit: string
        sources: string
        repeat: string
        muted: bool
        shuffle: bool
      then:
        - lambda: |-
            if (slot < 0 || slot >= 6) return;
            id(slot_step)[slot] = std::isfinite(step) && step > 0 ? step : 0.5f;
            id(slot_features)[slot] = features;
            id(slot_white)[slot] = white;
            id(slot_kelvin_min)[slot] = kelvin_min;
            id(slot_kelvin_max)[slot] = kelvin_max;
            id(slot_modes)[slot] = modes;
            id(slot_presets)[slot] = presets;
            id(slot_unit)[slot] = unit;
            id(slot_sources)[slot] = sources;
            id(slot_repeat)[slot] = repeat;
            id(slot_muted)[slot] = muted;
            id(slot_shuffle)[slot] = shuffle;
        - script.execute: ui_render
    - action: set_status_detail
      variables:
        slot: int
        value: string
        target: string
        priority: int
      then:
        - lambda: |-
            if (slot < 0 || slot >= 6) return;
            id(status_value)[slot] = value;
            id(status_target)[slot] = target;
            id(status_priority)[slot] = priority;
        - script.execute: ui_render
    - action: set_standby_climate
      variables:
        temperature: string
        humidity: string
      then:
        - lambda: |-
            id(desk_temp) = temperature;
            id(desk_rh) = humidity;
        - script.execute: update_clock
    - action: set_standby_player
      variables:
        eid: string
        state: string
        title: string
        artist: string
      then:
        - lambda: |-
            id(standby_player) = eid;
            id(standby_state) = state;
            id(standby_title) = title;
            id(standby_artist) = artist;
        - script.execute: update_clock
        - script.execute: update_now_playing
    - action: set_standby_options
      variables:
        seconds: int
        animate: bool
      then:
        - lambda: |-
            const int interval_seconds = static_cast<int>(seconds);
            id(status_seconds) = std::max(3, std::min(15, interval_seconds));
            id(weather_animate) = animate;
    - action: set_status
      variables:
        slot: int
        label: string
        icon: string
        active: bool
      then:
        - lambda: |-
            if (slot < 0 || slot >= 6) return;
            id(status_labels)[slot] = label;
            if (icon == "washer") {
              id(status_icons)[slot] = "water";
            } else {
              id(status_icons)[slot] = icon;
            }
            id(status_active)[slot] = active;
            id(ui_last_sync) = millis();
        - script.execute: ui_render
    - action: set_slot
      variables:
        slot: int
        eid: string
        label: string
        state: string
        dimmable: bool
        brightness: int
        color: int
        color_capable: bool
        title: string
        artist: string
        volume: float
        picture: string
        temp_now: float
        temp_target: float
        temp_min: float
        temp_max: float
        hvac_action: string
        battery_low: bool
      then:
        - lambda: |-
            if (slot < 0 || slot > 5) return;
            if(id(slot_eid)[slot]!=eid){id(slot_pending)[slot]=0;id(slot_temp_due)[slot]=0;}
            id(slot_eid)[slot] = eid;
            id(slot_label)[slot] = label;
            id(slot_state)[slot] = state;
            id(slot_dimmable)[slot] = dimmable;
            id(slot_bri)[slot] = brightness;
            id(slot_color)[slot] = (uint32_t) color;
            id(slot_color_capable)[slot] = color_capable;
            id(slot_title)[slot] = title;
            id(slot_artist)[slot] = artist;
            id(slot_vol)[slot] = volume;
            id(slot_pic)[slot] = picture;
            id(slot_tnow)[slot] = temp_now;
            id(slot_ttarget)[slot] = temp_target;
            id(slot_tmin)[slot] = temp_min;
            id(slot_tmax)[slot] = temp_max;
            id(slot_action)[slot] = hvac_action;
            id(slot_batt_low)[slot] = battery_low;
            id(ui_last_sync) = millis();
            id(slot_seen)[slot] = millis();
            int k = id(slot_pending)[slot];
            float expected = id(slot_expected)[slot];
            bool ack = (k == 1 && ((expected > 0 && state == "on") || (expected == 0 && state == "off"))) ||
                       (k == 2 && state == "on" && fabsf(brightness * 100.0f / 255.0f - expected) <= 2) ||
                       (k == 3 && fabsf(volume * 100 - expected) <= 2) ||
                       (k == 4 && fabsf(temp_target - expected) < 0.05f) ||
                       (k == 5 && ((expected > 0 && state == "playing") || (expected == 0 && state != "playing"))) ||
                       (k == 6 && ((expected > 0 && state != "off") || (expected == 0 && state == "off"))) ||
                       (k == 7 && static_cast<int>(color) == static_cast<int>(expected));
            if (ack && !id(slot_temp_due)[slot]) id(slot_pending)[slot] = 0;
        - if:
            condition:
              lambda: return slot == id(cur_slot);
            then:
              - script.execute: fill_current
            else:
              - script.execute: update_hint
        - script.execute: ui_render
    - action: set_weather
      variables:
        temp: float
        unit: string
        condition: string
      then:
        - lambda: |-
            static const std::map<std::string, const char *> icons = {
              {"clear-night", "\U000F0594"}, {"cloudy", "\U000F0590"},
              {"exceptional", "\U000F05D6"}, {"fog", "\U000F0591"},
              {"hail", "\U000F0592"}, {"lightning", "\U000F0593"},
              {"lightning-rainy", "\U000F067E"}, {"partlycloudy", "\U000F0595"},
              {"pouring", "\U000F0596"}, {"rainy", "\U000F0597"},
              {"snowy", "\U000F0598"}, {"snowy-rainy", "\U000F067F"},
              {"sunny", "\U000F0599"}, {"windy", "\U000F059D"},
              {"windy-variant", "\U000F059E"}};
            auto it = icons.find(condition);
            id(w_ok) = !(it == icons.end() || std::isnan(temp));
            id(w_cond) = condition;
            id(w_temp) = temp;

        - script.execute: apply_standby_style
    - action: set_pizza
      variables:
        slice: int
        label: string
        icon: string
      then:
        - lambda: |-
            if (slice < 1 || slice > pixizhi::PIZZA_PAGES * pixizhi::PIZZA_PAGE_SIZE) return;
            id(pizza_labels)[slice-1] = label;
            id(pizza_keys)[slice-1] = icon;
            id(ui_render).execute();
    - action: notify
      variables:
        title: string
        message: string
        icon: string
        color: int
        urgent: bool
      then:
        - lambda: |-
            if (id(nq_title).size() >= 5) {
              // queue full: drop the oldest normal one (or the oldest if all urgent)
              size_t k = 0;
              for (size_t i = 0; i < id(nq_title).size(); i++) if (!id(nq_urgent)[i]) { k = i; break; }
              id(nq_title).erase(id(nq_title).begin() + k);
              id(nq_msg).erase(id(nq_msg).begin() + k);
              id(nq_icon).erase(id(nq_icon).begin() + k);
              id(nq_color).erase(id(nq_color).begin() + k);
              id(nq_urgent).erase(id(nq_urgent).begin() + k);
              id(nq_time).erase(id(nq_time).begin() + k);
            }
            auto now = id(ha_time).now();
            uint32_t tm = now.is_valid() ? (uint32_t) now.timestamp : 0;
            // urgent ones go to the front of the queue
            size_t pos = urgent ? 0 : id(nq_title).size();
            id(nq_title).insert(id(nq_title).begin() + pos, title);
            id(nq_msg).insert(id(nq_msg).begin() + pos, message);
            id(nq_icon).insert(id(nq_icon).begin() + pos, icon);
            id(nq_color).insert(id(nq_color).begin() + pos, (uint32_t) color);
            id(nq_urgent).insert(id(nq_urgent).begin() + pos, urgent);
            id(nq_time).insert(id(nq_time).begin() + pos, tm);
        - script.execute: nq_save
        - script.execute: update_badge
        - script.execute: notif_led
        - if:
            condition:
              lambda: return id(overlay) == pixizhi::OVERLAY_NOTIFICATIONS;
            then:
              - script.execute: notif_fill
        - if:
            condition:
              lambda: return urgent;
            then:
              - script.execute: urgent_loop
            else:
              - if:
                  condition:
                    lambda: return id(overlay) == pixizhi::OVERLAY_NOTIFICATIONS;
                  then:
                    - script.execute: notif_fill
    - action: clear_notifications
      then:
        - lambda: |-
            id(nq_title).clear(); id(nq_msg).clear(); id(nq_icon).clear();
            id(nq_color).clear(); id(nq_urgent).clear(); id(nq_time).clear();
        - script.execute: nq_save
        - script.stop: urgent_loop
        - script.execute: notif_closed
    - action: flash_led
      variables:
        rgb: int
        count: int
        on_ms: int
        off_ms: int
      then:
        - if:
            condition:
              lambda: return id(dnd).state;
            then:
              - logger.log: "LED flash skipped (Do Not Disturb)"
            else:
              - script.execute:
                  id: flash_led
                  rgb: !lambda return rgb;
                  count: !lambda return count;
                  on_ms: !lambda return on_ms;
                  off_ms: !lambda return off_ms;
    # Planes from the What's-that-plane integration (one list entry per visible plane).
    - action: set_planes
      variables:
        models: string[]
        callsigns: string[]
        airlines: string[]
        origins: string[]
        destinations: string[]
        registrations: string[]
      then:
        - lambda: |-
            const size_t n = models.size();
            auto at = [](const std::vector<std::string> &v, size_t i) { return i < v.size() ? v[i] : std::string(); };
            std::vector<std::string> visible;
            for (size_t i = 0; i < n; i++) {
              std::string key = at(callsigns, i).empty() ? at(registrations, i) : at(callsigns, i);
              if (key.empty()) key = at(models, i) + at(origins, i) + at(destinations, i);
              visible.push_back(key);
              bool known = std::find(id(plane_shown).begin(), id(plane_shown).end(), key) != id(plane_shown).end();
              if (!known && id(plane_spotting).state) {
                // Stored as: model, callsign (shown as the flight code), airline, from, to, registration.
                id(plane_queue).push_back({at(models, i), at(callsigns, i), at(airlines, i), at(origins, i), at(destinations, i), at(registrations, i)});
                id(plane_shown).push_back(key);
              }
            }
            // Forget planes that left the view, so they show again if they return later.
            std::vector<std::string> keep;
            for (auto &k : id(plane_shown))
              if (std::find(visible.begin(), visible.end(), k) != visible.end()) keep.push_back(k);
            id(plane_shown) = keep;
    - action: clear_slot
      variables:
        slot: int
      then:
        - lambda: |-
            if (slot < 0 || slot > 5) return;
            id(slot_eid)[slot] = "";
            id(slot_pic)[slot] = "";
            id(slot_pending)[slot] = 0;
            id(slot_temp_due)[slot] = 0;
            id(slot_seen)[slot] = 0;
        - if:
            condition:
              lambda: return slot == id(cur_slot);
            then:
              - lambda: id(cur_slot) = -1;
              - script.execute: show_current
            else:
              - script.execute: update_hint

time:
  - platform: homeassistant
    id: ha_time
    # Home Assistant 2026.3+ sends its own timezone at runtime; UTC is a fallback.
    timezone: UTC
    on_time_sync:
      - script.execute: timer_restore
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

# --- SLOT DATA (filled by the Home Assistant blueprint) ----------------------
globals:
  - id: night_active
    type: bool
    initial_value: 'false'
  - id: clock_brightness_until
    type: uint32_t
    initial_value: '0'
  - id: notification_line
    type: int
    initial_value: '0'
  - id: pizza_labels
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>{"ACTION 1","ACTION 2","ACTION 3","ACTION 4","","","","","","","",""}'
  - id: pizza_keys
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(12,"star")'
  - id: pizza_pg
    type: int
    initial_value: '0'
  # Pages with at least one labelled slice; page 0 always exists.
  - id: pizza_page_count
    type: std::function<int()>
    initial_value: |-
      []() -> int {
        int pages = 1;
        for (int p = 1; p < pixizhi::PIZZA_PAGES; p++)
          for (int k = 0; k < pixizhi::PIZZA_PAGE_SIZE; k++)
            if (!id(pizza_labels)[p * pixizhi::PIZZA_PAGE_SIZE + k].empty()) pages = p + 1;
        return pages;
      }
  - id: sendspin_pairing_visible
    type: bool
    initial_value: 'false'
  - id: audio_display_paused
    type: bool
    initial_value: 'false'
  - id: standby_music_enabled
    type: bool
    initial_value: 'true'
  - id: ui_frame_dirty
    type: bool
    initial_value: 'false'
  - id: clock_frame_dirty
    type: bool
    initial_value: 'false'
  - id: status_priority
    type: std::vector<int>
    initial_value: 'std::vector<int>(6, 0)'
  - id: slot_sources
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(6, "")'
  - id: slot_repeat
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>(6, "off")'
  - id: slot_muted
    type: std::vector<bool>
    initial_value: 'std::vector<bool>(6, false)'
  - id: slot_shuffle
    type: std::vector<bool>
    initial_value: 'std::vector<bool>(6, false)'
  - id: slot_temp_due
    type: std::vector<uint32_t>
    initial_value: 'std::vector<uint32_t>(6, 0)'
  - id: ui_view
    type: int
    initial_value: '0'
  - id: ui_category
    type: int
    initial_value: '0'
  - id: ui_list_offset
    type: int
    initial_value: '0'
  - id: ui_status_detail
    type: int
    initial_value: '-1'
  - id: ui_touch_view
    type: int
    initial_value: '0'
  - id: ui_touch_slot
    type: int
    initial_value: '-1'
  - id: ui_touch_overlay
    type: int
    initial_value: '0'
  - id: ui_wake_only
    type: bool
    initial_value: 'false'
  - id: ui_dial_value
    type: float
    initial_value: '0'
  - id: ui_dial_base
    type: float
    initial_value: '0'
  - id: ui_volume_limit
    type: int
    initial_value: '65'
  - id: ui_gesture_mode
    type: int
    initial_value: '0'
  - id: ui_last_sync
    type: uint32_t
    initial_value: '0'
  - id: ui_scroll_ms
    type: uint32_t
    initial_value: '0'
  - id: ui_scroll_tick
    type: int
    initial_value: '-1'
  - id: ui_message
    type: std::string
    initial_value: '""'
  - id: ui_message_until
    type: uint32_t
    initial_value: '0'
  - id: slot_step
    type: std::vector<float>
    initial_value: 'std::vector<float>(6, 0.5f)'
  - id: slot_features
    type: std::vector<int>
    initial_value: 'std::vector<int>(6, 0)'
  - id: slot_kelvin_min
    type: std::vector<int>
    initial_value: 'std::vector<int>(6, 2000)'
  - id: slot_kelvin_max
    type: std::vector<int>
    initial_value: 'std::vector<int>(6, 6500)'
  - id: slot_white
    type: std::vector<bool>
