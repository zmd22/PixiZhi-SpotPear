# --- TOUCH ----------------------------------------------------------------------
touchscreen:
  - platform: cst816
    id: my_touchscreen
    interrupt_pin:
      number: GPIO12
      allow_other_uses: true
    reset_pin: GPIO6
    display: main_display
    i2c_id: bus_b
    on_touch:
      - lambda: |-
          if (id(sendspin_pairing_visible) || id(setup_state)==1 || id(setup_state)==2 || id(siren_active)) return;
          id(gs_touch_active)=true;
          id(ui_touch_view)=id(ui_view);id(ui_touch_slot)=id(cur_slot);id(ui_touch_overlay)=id(overlay);
          id(gs_clock_origin)=id(overlay)==pixizhi::OVERLAY_NONE && id(ui_view)==pixizhi::VIEW_STANDBY && id(cur_slot)<0;
          id(ui_wake_only)=id(bl_dimmed);
          id(gs_start_x)=touch.x;id(gs_start_y)=touch.y;id(gs_last_x)=touch.x;id(gs_last_y)=touch.y;
          id(gs_start_ms)=millis();id(gs_touch_id)=touch.id;id(gs_max_move)=0;
          float rx=touch.x-120.0f,ry=touch.y-120.0f;
          bool dial=id(gs_clock_origin);
          int s=id(cur_slot);
          if(id(ui_view)==pixizhi::VIEW_SLOT && s>=0 && s<6 && id(slot_seen)[s]!=0 && (uint32_t)(millis()-id(slot_seen)[s])<45000 &&
             id(slot_state)[s]!="unknown" && id(slot_state)[s]!="unavailable") {
            auto &e=id(slot_eid)[s];bool music=e.rfind("media_player.",0)==0,climate=e.rfind("climate.",0)==0;
            dial=(music&&(id(slot_features)[s]&4)) || (climate&&(id(slot_features)[s]&1)) || id(slot_dimmable)[s];
            id(ui_dial_base)=music?id(slot_vol)[s]*100:climate?id(slot_ttarget)[s]:id(slot_bri)[s]*100.0f/255;
            int k=id(slot_pending)[s];if(k==2||k==3||k==4)id(ui_dial_base)=id(slot_expected)[s];
            id(ui_dial_value)=id(ui_dial_base);
          }
          // Bottom gap is reserved for navigation and large buttons, not dial capture.
          id(gs_ring_candidate)=!id(ui_wake_only)&&id(overlay)==pixizhi::OVERLAY_NONE&&dial&&rx*rx+ry*ry>=94.0f*94.0f&&!(touch.y>185&&touch.x>70&&touch.x<170);
          id(gs_rotating)=false;id(gs_turn)=0;id(gs_angle)=atan2f(ry,rx);id(gs_last_apply)=0;
          id(gs_base_brightness)=id(is_night)()?id(night_brightness).state/100.0f:id(screen_light).remote_values.get_brightness();id(gs_target_brightness)=id(gs_base_brightness);
          if(id(bl_dimmed)){id(bl_dimmed)=false;id(apply_backlight).execute();}
    on_update:
      - lambda: |-
          if (id(sendspin_pairing_visible) || id(setup_state)==1 || id(setup_state)==2 || id(siren_active)) { id(gs_touch_active)=false; return; }
          if(!id(gs_touch_active))return;
          for(auto &t:touches)if(t.id==id(gs_touch_id)&&t.state>=1&&t.state<=2){
            id(gs_last_x)=t.x;id(gs_last_y)=t.y;
            id(gs_max_move)=std::max(id(gs_max_move),std::max(std::abs((int)t.x-id(gs_start_x)),std::abs((int)t.y-id(gs_start_y))));
            if(id(ui_wake_only)||id(ui_touch_view)!=id(ui_view)||id(ui_touch_slot)!=id(cur_slot)||id(ui_touch_overlay)!=id(overlay)){id(gs_ring_candidate)=false;break;}
            if(id(gs_ring_candidate)){
              float rx=t.x-120.0f,ry=t.y-120.0f;
              if(rx*rx+ry*ry<83.0f*83.0f){id(gs_ring_candidate)=false;break;}
              float angle=atan2f(ry,rx),delta=angle-id(gs_angle);
              if(delta>3.14159265f)delta-=6.2831853f;if(delta< -3.14159265f)delta+=6.2831853f;
              id(gs_angle)=angle;
              if(fabsf(delta)>0.7853982f){id(gs_ring_candidate)=false;break;}
              id(gs_turn)+=delta;
              if(fabsf(id(gs_turn))>=0.174533f)id(gs_rotating)=true;
              if(id(gs_rotating)&&(uint32_t)(millis()-id(gs_last_apply))>=50){id(gs_last_apply)=millis();
                if(id(gs_clock_origin))id(clock_brightness_apply).execute();else id(ui_dial_apply).execute();}
            }break;
          }
    on_release:
      - lambda: |-
          if (id(sendspin_pairing_visible) || id(setup_state)==1 || id(setup_state)==2 || id(siren_active)) { id(gs_touch_active)=false; return; }
          if(!id(gs_touch_active))return;
          id(gs_touch_active)=false;
          if(id(ui_wake_only))return;
          if(id(ui_touch_view)!=id(ui_view)||id(ui_touch_slot)!=id(cur_slot)||id(ui_touch_overlay)!=id(overlay))return;
          if(id(gs_rotating)){
            if(id(gs_clock_origin)){id(clock_brightness_apply).execute();id(report_clock_rotation).execute();}
            else{id(ui_dial_apply).execute();id(ui_dial_commit).execute();}return;
          }
          const int px=id(gs_last_x), py=id(gs_last_y);
          const int dx0=px-id(gs_start_x),dy0=py-id(gs_start_y);
          const uint32_t held_ms=millis()-id(gs_start_ms);
          if(id(overlay)==pixizhi::OVERLAY_NOTIFICATIONS) {
            if(std::abs(dy0)>=30) {id(notification_line)=std::max(0,id(notification_line)+(dy0<0?2:-2));id(ui_render).execute();}
            else if(id(gs_max_move)<=16) id(notif_dismiss).execute(held_ms>=1000);
            return;
          }
          if(id(overlay)==pixizhi::OVERLAY_TIMER) {
            if(id(gs_max_move)>16)return;
            if(py>207){id(ui_home).execute();return;}
            if(py>=170){if(held_ms>=1000)id(timer_reset).execute();else id(timer_main).execute();return;}
            if(py>=122&&py<168&&(px<96||px>144)&&!id(timer_running)&&!id(timer_done)&&id(timer_left)==id(timer_set_min)*60){
              id(timer_set_min)=std::max(1,std::min(60,id(timer_set_min)+(px<120?-1:1)));
              id(timer_left)=id(timer_set_min)*60;id(timer_ui).execute();}return;
          }
          if(id(cur_slot)==pixizhi::SLOT_PIZZA && id(ui_view)==pixizhi::VIEW_STANDBY) {
            if(std::abs(dx0)>=34&&std::abs(dx0)>std::abs(dy0)){
              int pages=id(pizza_page_count)();
              if(pages>1){id(pizza_pg)=(id(pizza_pg)+(dx0<0?1:pages-1))%pages;id(pizza_sel)=-1;id(ui_render).execute();}
              return;
            }
            if(id(gs_max_move)>16)return;
            if(py>207){id(ui_home).execute();return;}
            int dx=px-120,dy=py-120;
            if(std::abs(dx)<30&&std::abs(dy)<30){id(ui_home).execute();return;}
            id(pizza_sel)=std::abs(dy)>=std::abs(dx)?(dy<0?0:2):(dx>0?1:3);
            if(id(pizza_labels)[id(pizza_pg)*pixizhi::PIZZA_PAGE_SIZE+id(pizza_sel)].empty()){id(pizza_sel)=-1;return;}
            id(pizza_fire).execute();id(ui_render).execute();return;
          }
          if((id(ui_view)==pixizhi::VIEW_HEATING_LIST||id(ui_view)==pixizhi::VIEW_CATEGORY_LIST)&&std::abs(dy0)>=30&&std::abs(dy0)>std::abs(dx0)) {
            if(dy0<0)id(pulse_swipe_up).execute();else id(pulse_swipe_down).execute();
            if(id(ui_gesture_mode)==1||id(ui_gesture_mode)==2)return;
            int count=0;for(auto &e:id(slot_eid))if(id(ui_view)==pixizhi::VIEW_HEATING_LIST?e.rfind("climate.",0)==0:id(ui_category)==0?(e.rfind("light.",0)==0||e.rfind("switch.",0)==0):e.rfind("media_player.",0)==0)count++;
            id(ui_list_offset)=std::max(0,std::min(std::max(0,count-2),id(ui_list_offset)+(dy0<0?1:-1)));
            id(ui_scroll_ms)=millis();id(ui_render).execute();return;
          }
          if((id(ui_view)==pixizhi::VIEW_HEATING_LIST||id(ui_view)==pixizhi::VIEW_CATEGORY_LIST)&&std::abs(dx0)>=30&&std::abs(dx0)>std::abs(dy0))return;
          // Existing overlay widgets retain their own buttons. No global gesture click-through.
          if(id(overlay)!=pixizhi::OVERLAY_NONE)return;
          if(id(ui_view)==pixizhi::VIEW_STANDBY && !id(gs_clock_origin))return;
          int dx=id(gs_last_x)-id(gs_start_x),dy=id(gs_last_y)-id(gs_start_y);
          uint32_t dt=millis()-id(gs_start_ms);int ax=std::abs(dx),ay=std::abs(dy);
          bool dashboard=id(ui_view)>0;
          if(dt<=1500&&(ax>=34||ay>=34)){
            // A rejected rim interaction is consumed, never converted into a swipe.
            int rx=id(gs_start_x)-120,ry=id(gs_start_y)-120;
            if(rx*rx+ry*ry>=94*94 && (id(gs_clock_origin)||id(ui_view)==pixizhi::VIEW_SLOT))return;
            if(ax>=ay){if(dx<0)id(pulse_swipe_left).execute();else id(pulse_swipe_right).execute();}
            else{if(dy<0)id(pulse_swipe_up).execute();else id(pulse_swipe_down).execute();}
            if(id(ui_gesture_mode)==1||id(ui_gesture_mode)==2)return;
            int v=id(ui_view);
            if(ax>=ay){
              if(v==5||v==9||v==10){int count=0;
                if(v==5){for(int q=0;q<6;q++){auto &e=id(slot_eid)[q];if(id(ui_category)==0?(e.rfind("light.",0)==0||e.rfind("switch.",0)==0):e.rfind("media_player.",0)==0)count++;}}
                else if(v==9||v==10){int s=id(cur_slot);if(s>=0&&s<6){std::string a=v==9?id(slot_modes)[s]+"|"+id(slot_presets)[s]:id(slot_sources)[s];for(char c:a)if(c=='|')count++;count+=v==9?1:4;}}
                int maxoff=std::max(0,((count-1)/3)*3);id(ui_list_offset)=std::max(0,std::min(maxoff,id(ui_list_offset)+(dx<0?3:-3)));id(ui_render).execute();
              } else if(v==7){int q=id(ui_status_detail);id(ui_status_detail)=(q+(dx<0?1:5))%6;id(ui_render).execute();}
              else if(v==0||v==2)id(ui_cycle).execute(dx<0?1:-1);
            }else if(v==pixizhi::VIEW_PLANE)id(plane_end).execute();
            else if(dy>0){if(v==pixizhi::VIEW_STANDBY)id(ui_open).execute(pixizhi::VIEW_QUICK);else if(v!=pixizhi::VIEW_QUICK)id(ui_back).execute();}
            else if(v==pixizhi::VIEW_QUICK)id(ui_home).execute();
            else if(v==0)id(ui_open).execute(pixizhi::VIEW_MORE);
            else if(v==2){int s=id(cur_slot);if(s>=0&&s<6){auto &e=id(slot_eid)[s];if(e.rfind("climate.",0)==0)id(ui_open).execute(pixizhi::VIEW_CLIMATE_MODES);else if(e.rfind("media_player.",0)==0)id(ui_open).execute(pixizhi::VIEW_MUSIC_OPTIONS);else id(ui_colors_open).execute();}}
            return;
          }
          if(id(gs_max_move)>16)return;
          if(dt>=1400&&id(gs_max_move)<=12&&id(gs_clock_origin)){id(standby_long_press).execute();return;}
          if(dt>=600)return;
          if(dashboard){id(ui_tap).execute(id(gs_start_x),id(gs_start_y));return;}
          if(!id(gs_clock_origin))return;
          int x=id(gs_start_x),y=id(gs_start_y);
          if(!id(nq_title).empty()&&y>193){id(open_notifications).execute();return;}
          if(y<76&&id(status_row)>=0){id(ui_status_detail)=id(status_row);id(ui_open).execute(pixizhi::VIEW_STATUS_DETAIL);return;}
          if(y>=155&&id(standby_music_enabled)&&id(standby_state)=="playing"){
            for(int q=0;q<6;q++)if(id(slot_eid)[q]==id(standby_player)){id(cur_slot)=q;id(show_current).execute();return;}
            id(ui_category_open).execute(1);return;
          }
          id(ui_open).execute(pixizhi::VIEW_MENU);

# --- DISPLAY ------------------------------------------------------------------
display:
  - platform: mipi_spi
    id: main_display
    model: GC9A01A
    # Shorten synchronous display transfers (previous default: 10 MHz).
    data_rate: 40MHz
    invert_colors: true
    cs_pin: GPIO5
    dc_pin: GPIO47
    reset_pin: GPIO38
    update_interval: never
    auto_clear_enabled: false

# --- FONTS ----------------------------------------------------------------------
font:
  - file: fonts/pixizhi-pixel.ttf
    id: pixel_small
    size: 10
    bpp: 1
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
  - file: fonts/pixizhi-pixel.ttf
    id: pixel_medium
    size: 20
    bpp: 1
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
  - file: fonts/pixizhi-pixel.ttf
    id: pixel_large
    size: 40
    bpp: 1
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

# --- SCRIPTS --------------------------------------------------------------------
script:
  - id: apply_audio_output
    mode: restart
    then:
      - switch.turn_off: speaker_enable
      - if:
          condition:
            # The siren always uses the built-in speaker, whatever output is selected.
            lambda: return id(audio_output).active_index().value_or(0) == 1 && !id(siren_active);
          then:
            - router.speaker.switch_output:
                id: box_speaker
                target_speaker: usb_speaker
          else:
            - router.speaker.switch_output:
                id: box_speaker
                target_speaker: internal_speaker
            - delay: 100ms
            - switch.turn_on: speaker_enable
  - id: ui_open
    parameters:
      view: int
    then:
      - lambda: |-
          id(overlay) = pixizhi::OVERLAY_NONE;
          id(ui_view) = view;
          id(ui_list_offset) = 0;
          id(ui_scroll_ms) = millis();
          id(ui_scroll_tick) = -1;
      - lvgl.page.show: dashboard_page
      - script.execute: ui_render
  - id: ui_home
    then:
      - lambda: id(cur_slot) = -1; id(pizza_pg) = 0;
      - script.execute: show_current
  - id: ui_back
    then:
      - lambda: |-
          if(id(overlay)!=pixizhi::OVERLAY_NONE || id(ui_view)==pixizhi::VIEW_MENU) {id(ui_home).execute();return;}
          if(id(ui_view)==8 || id(ui_view)==pixizhi::VIEW_CLIMATE_MODES || id(ui_view)==pixizhi::VIEW_MUSIC_OPTIONS) {id(ui_open).execute(pixizhi::VIEW_SLOT);return;}
          id(ui_open).execute(pixizhi::VIEW_MENU);
  - id: ui_category_open
    parameters:
      category: int
    then:
      - lambda: |-
          id(ui_category)=category;
          if(category==2){id(ui_open).execute(pixizhi::VIEW_HEATING_LIST);return;}
          int count=0,first=-1;
          for(int i=0;i<6;i++) {
            auto &e=id(slot_eid)[i];
            bool match=category==0?(e.rfind("light.",0)==0||e.rfind("switch.",0)==0):e.rfind("media_player.",0)==0;
            if(match){count++;if(first<0)first=i;}
          }
          if(count==1){id(cur_slot)=first;id(show_current).execute();}
          else id(ui_open).execute(pixizhi::VIEW_CATEGORY_LIST);
  - id: ui_cycle
    parameters:
      direction: int
    then:
      - lambda: |-
          std::vector<int> slots;
          for(int i=0;i<6;i++)if(!id(slot_eid)[i].empty())slots.push_back(i);
          if(slots.empty()){id(ui_open).execute(pixizhi::VIEW_MENU);return;}
          int pos=-1;for(int i=0;i<(int)slots.size();i++)if(slots[i]==id(cur_slot))pos=i;
          pos=pos<0?(direction>0?0:slots.size()-1):(pos+direction+slots.size())%slots.size();
          id(cur_slot)=slots[pos];id(show_current).execute();
  - id: ui_command
    mode: parallel
    max_runs: 8
    parameters:
      slot: int
      kind: int
      value: float
      option: string
    then:
      - if:
          condition:
            lambda: |-
              return id(ha_online)() && slot>=0 && slot<6 && !id(slot_eid)[slot].empty() && id(slot_seen)[slot]!=0 &&
                (uint32_t)(millis()-id(slot_seen)[slot])<45000 &&
                id(slot_state)[slot]!="unavailable" && id(slot_state)[slot]!="unknown";
          then:
            - lambda: |-
                if(kind<=7) {id(slot_pending)[slot]=kind;id(slot_expected)[slot]=value;id(slot_command_ms)[slot]=millis();}
                id(ui_message)="SENDING";id(ui_message_until)=millis()+900;
            - if:
                condition:
                  lambda: return kind==1;
                then:
                  - homeassistant.action:
                      action: !lambda return std::string(value>0?"homeassistant.turn_on":"homeassistant.turn_off");
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
            - if:
                condition:
                  lambda: return kind==2;
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        brightness_pct: !lambda return esphome::to_string((int)roundf(fmaxf(1,fminf(100,value))));
            - if:
                condition:
                  lambda: return kind==3;
                then:
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        volume_level: !lambda return esphome::to_string(fmaxf(0,fminf(id(ui_volume_limit),value))/100.0f);
            - if:
                condition:
                  lambda: return kind==4;
                then:
                  - homeassistant.action:
                      action: climate.set_temperature
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        temperature: !lambda return esphome::to_string(value);
            - if:
                condition:
                  lambda: return kind==5;
                then:
                  - homeassistant.action:
                      action: !lambda return std::string(value>0?"media_player.media_play":"media_player.media_pause");
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
            - if:
                condition:
                  lambda: return kind==6 || kind==9;
                then:
                  - homeassistant.action:
                      action: climate.set_hvac_mode
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        hvac_mode: !lambda return option;
            - if:
                condition:
                  lambda: return kind==7 && id(slot_color_capable)[slot];
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                      data_template:
                        rgb_color: "{{ [red, green, blue] }}"
                      variables:
                        red: !lambda return (static_cast<int>(value)>>16)&255;
                        green: !lambda return (static_cast<int>(value)>>8)&255;
                        blue: !lambda return static_cast<int>(value)&255;
            - if:
                condition:
                  lambda: return kind==8 && id(slot_white)[slot];
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        color_temp_kelvin: !lambda return esphome::to_string((int)value);
            - if:
                condition:
                  lambda: return kind==10;
                then:
                  - homeassistant.action:
                      action: climate.set_preset_mode
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        preset_mode: !lambda return option;
            - if:
                condition:
                  lambda: return kind==11;
                then:
                  - homeassistant.action:
                      action: !lambda return "media_player."+option;
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
            - if:
                condition:
                  lambda: return kind==12;
                then:
                  - homeassistant.action:
                      action: media_player.volume_mute
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        is_volume_muted: !lambda return value>0?"true":"false";
            - if:
                condition:
                  lambda: return kind==13;
                then:
                  - homeassistant.action:
                      action: media_player.shuffle_set
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        shuffle: !lambda return value>0?"true":"false";
            - if:
                condition:
                  lambda: return kind==14;
                then:
                  - homeassistant.action:
                      action: media_player.repeat_set
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        repeat: !lambda return option;
            - if:
                condition:
                  lambda: return kind==15;
                then:
                  - homeassistant.action:
                      action: media_player.select_source
                      data:
                        entity_id: !lambda return id(slot_eid)[slot];
                        source: !lambda return option;
          else:
            - lambda: id(ui_message)=id(ha_online)()?"HA UNAVAILABLE":"HA OFFLINE"; id(ui_message_until)=millis()+2000;
      - script.execute: ui_render
  - id: ui_temperature
    parameters:
      slot: int
      target: float
    then:
      - lambda: |-
          if(slot<0||slot>=6)return;
          id(slot_pending)[slot]=4;id(slot_expected)[slot]=target;
          id(slot_command_ms)[slot]=millis();id(slot_temp_due)[slot]=millis()+450;
      - script.execute: ui_render
  - id: ui_dial_apply
    then:
      - lambda: |-
          int s=id(cur_slot);if(s<0||s>=6||id(ui_view)!=pixizhi::VIEW_SLOT)return;
          auto &e=id(slot_eid)[s];float span=100;
          float lo=1,hi=100,step=1;
          if(e.rfind("media_player.",0)==0){lo=0;hi=id(ui_volume_limit);}
          else if(e.rfind("climate.",0)==0){lo=id(slot_tmin)[s];hi=id(slot_tmax)[s];step=id(slot_step)[s];span=hi-lo;}
          float v=id(ui_dial_base)+id(gs_turn)/4.712389f*span;
          v=lo+roundf((v-lo)/step)*step;
          id(ui_dial_value)=fmaxf(lo,fminf(hi,v));
      - script.execute: ui_render
  - id: ui_dial_commit
    then:
      - lambda: |-
          int s=id(cur_slot);if(s<0||s>=6)return;
          auto &e=id(slot_eid)[s];int k=e.rfind("media_player.",0)==0?3:e.rfind("climate.",0)==0?4:2;
          if(k==4)id(ui_temperature).execute(s,id(ui_dial_value));
          else id(ui_command).execute(s,k,id(ui_dial_value),"");
  - id: ui_tap
    parameters:
      x: int
      y: int
    then:
      - lambda: |-
          int v=id(ui_view),s=id(cur_slot);
          if(v==pixizhi::VIEW_PLANE){id(plane_end).execute();return;}
          if(v==pixizhi::VIEW_QUICK){
            if(y>=72&&y<=214){int col=x<90?0:x<150?1:2,row=y<144?0:1;id(quick_tile).execute(row*3+col);}
            return;
          }
          if(y>=207 && x>=91 && x<=149){id(ui_home).execute();return;}
          if(v==1){if(y>=43&&y<=110)id(ui_category_open).execute(x<120?0:1);
            else if(y>=116&&y<=187){if(x<120)id(ui_category_open).execute(2);else id(ui_open).execute(pixizhi::VIEW_MORE);}return;}
          if(v==6){if(y>=52&&y<=112){if(x<120)id(open_notifications).execute();else id(open_timer).execute();}
            else if(y>=120&&y<=185){if(x<120){id(cur_slot)=6;id(show_current).execute();}else id(ui_open).execute(pixizhi::VIEW_HEATING_HOME);}return;}
          if(v==3){
            if(y>=55&&y<92){id(ui_category_open).execute(0);return;}
            if(y>=92&&y<163){int n=(y-92)/31,r=0;for(int q=0;q<6;q++)if(id(slot_eid)[q].rfind("climate.",0)==0){if(r++==n){id(cur_slot)=q;id(show_current).execute();return;}}}
            if(y>=173&&y<207){int active=-1;for(int q=0;q<6;q++)if(id(status_active)[q]&&(active<0||id(status_priority)[q]>id(status_priority)[active]))active=q;if(active>=0){id(ui_status_detail)=active;id(ui_open).execute(pixizhi::VIEW_STATUS_DETAIL);}}return;
          }
          if((v==4||v==5)&&y>=190&&y<=211){id(ui_list_offset)++;id(ui_scroll_ms)=millis();id(ui_render).execute();return;}
          if(v==4||v==5){std::vector<int> rows;for(int q=0;q<6;q++){auto &e=id(slot_eid)[q];
            bool match=v==4?e.rfind("climate.",0)==0:id(ui_category)==0?(e.rfind("light.",0)==0||e.rfind("switch.",0)==0):e.rfind("media_player.",0)==0;
            if(match)rows.push_back(q);}
            int r=(v==4?(y-55)/67:(y-55)/62)+id(ui_list_offset);
            if(y>=58&&y<190&&r>=0&&r<(int)rows.size()){id(cur_slot)=rows[r];id(show_current).execute();}return;}
          if(v==7){int q=id(ui_status_detail);if(q>=0&&q<6&&y>95&&y<205){for(int j=0;j<6;j++)if(!id(status_target)[q].empty()&&id(slot_eid)[j]==id(status_target)[q]){id(cur_slot)=j;id(show_current).execute();return;}id(ui_status_action).execute(q);}return;}
          if(s<0||s>=6)return;
          if(id(slot_seen)[s]==0 || (uint32_t)(millis()-id(slot_seen)[s])>45000 || id(slot_state)[s]=="unavailable"||id(slot_state)[s]=="unknown") {id(ui_message)="HA UNAVAILABLE";id(ui_message_until)=millis()+2000;id(ui_render).execute();return;}
          auto &e=id(slot_eid)[s];
          if(v==9){std::vector<std::pair<std::string,bool>> choices;
            auto add=[&](std::string vals,bool preset){size_t start=0;while(start<vals.size()){size_t p=vals.find('|',start);auto a=vals.substr(start,p==std::string::npos?p:p-start);if(!a.empty())choices.push_back({a,preset});if(p==std::string::npos)break;start=p+1;}};
            add(id(slot_modes)[s],false);add(id(slot_presets)[s],true);
            int r=(y-59)/39+id(ui_list_offset);if(y>=59&&y<185&&r>=0&&r<(int)choices.size())id(ui_command).execute(s,choices[r].second?10:9,0,choices[r].first);return;}
          if(v==10){id(ui_music_option).execute(x,y);return;}
          if(v!=2)return;
          if(e.rfind("light.",0)==0||e.rfind("switch.",0)==0) {
            if(y>=161&&y<=204){if(x<120){bool on=id(slot_pending)[s]==1?id(slot_expected)[s]>0:id(slot_state)[s]=="on";id(ui_command).execute(s,1,on?0:1,"");}
              else if(id(slot_color_capable)[s]||id(slot_white)[s])id(ui_colors_open).execute();}
          } else if(e.rfind("media_player.",0)==0){int f=id(slot_features)[s];
            if(y>=160&&y<=206){if(x<87&&(f&16))id(ui_command).execute(s,11,0,"media_previous_track");
              else if(x>153&&(f&32))id(ui_command).execute(s,11,0,"media_next_track");
              else if(x>=87&&x<=153){bool playing=id(slot_pending)[s]==5?id(slot_expected)[s]>0:id(slot_state)[s]=="playing";if((playing&&(f&1))||(!playing&&(f&(512|16384))))id(ui_command).execute(s,5,playing?0:1,"");}}
            else if(y>=26&&y<=155){id(ui_open).execute(pixizhi::VIEW_MUSIC_OPTIONS);}
          } else {
            if(y>=145&&y<=181&&(x<95||x>145)&&(id(slot_features)[s]&1)){
              float t=id(slot_pending)[s]==4?id(slot_expected)[s]:id(slot_ttarget)[s];float step=id(slot_step)[s];
              t=fmaxf(id(slot_tmin)[s],fminf(id(slot_tmax)[s],t+(x<120?-step:step)));id(ui_temperature).execute(s,t);
            } else if(y>=183&&y<=206)id(ui_open).execute(pixizhi::VIEW_CLIMATE_MODES);
          }
  - id: ui_colors_open
    then:
      - lambda: |-
          int s=id(cur_slot);if(s<0||s>=6)return;
          id(ui_view)=0;
          auto enable=[](lv_obj_t *o,bool on){if(on)lv_obj_remove_state(o,LV_STATE_DISABLED);else lv_obj_add_state(o,LV_STATE_DISABLED);};
          enable(id(color_wheel),id(slot_color_capable)[s]);
          enable(id(white_preset_0),id(slot_white)[s]);
          enable(id(white_preset_1),id(slot_white)[s]);
          enable(id(white_preset_2),id(slot_white)[s]);
          enable(id(hue_preset_0),id(slot_color_capable)[s]);
          enable(id(hue_preset_1),id(slot_color_capable)[s]);
          enable(id(hue_preset_2),id(slot_color_capable)[s]);
          enable(id(hue_preset_3),id(slot_color_capable)[s]);
          enable(id(hue_preset_4),id(slot_color_capable)[s]);
          enable(id(hue_preset_5),id(slot_color_capable)[s]);
          enable(id(hue_preset_6),id(slot_color_capable)[s]);
          enable(id(hue_preset_7),id(slot_color_capable)[s]);
          enable(id(hue_preset_8),id(slot_color_capable)[s]);
          enable(id(hue_preset_9),id(slot_color_capable)[s]);
          enable(id(hue_preset_10),id(slot_color_capable)[s]);
          enable(id(hue_preset_11),id(slot_color_capable)[s]);
      - lvgl.page.show: colors_page
  - id: ui_status_action
    parameters:
      slot: int
    then:
      - homeassistant.event:
          event: esphome.pixizhi_status_tap
          data:
            node: ${name}
            slot: !lambda return esphome::to_string(slot+1);
  - id: ui_music_option
    parameters:
      x: int
      y: int
    then:
      - lambda: |-
          int s=id(cur_slot);if(s<0||s>=6)return;
          int f=id(slot_features)[s];
          std::vector<std::pair<int,std::string>> rows;
          if(f&8)rows.push_back({12,id(slot_muted)[s]?"UNMUTE":"MUTE"});
          if(f&32768)rows.push_back({13,id(slot_shuffle)[s]?"SHUFFLE OFF":"SHUFFLE ON"});
          if(f&262144)rows.push_back({14,"REPEAT "+id(slot_repeat)[s]});
          if(f&2048){std::string values=id(slot_sources)[s];size_t start=0;while(start<values.size()){
            size_t p=values.find('|',start);auto v=values.substr(start,p==std::string::npos?p:p-start);if(!v.empty())rows.push_back({15,v});if(p==std::string::npos)break;start=p+1;}}
          int r=(y-59)/39+id(ui_list_offset);if(y<59||y>=185||r<0||r>=(int)rows.size())return;
          int k=rows[r].first;std::string option=rows[r].second;
          if(k==14)option=id(slot_repeat)[s]=="off"?"all":id(slot_repeat)[s]=="all"?"one":"off";
          float value=k==12?!id(slot_muted)[s]:k==13?!id(slot_shuffle)[s]:0;
          id(ui_command).execute(s,k,value,option);
  - id: ui_render
    then:
      - lambda: id(ui_frame_dirty) = true;
  # All drawing lives in pixizhi_draw.h; this only picks the canvas and fills the state.
  - id: ui_paint_frame
    then:
      - lambda: |-
          if (!id(ui_ready) || (id(overlay)==pixizhi::OVERLAY_NONE && id(ui_view)==pixizhi::VIEW_STANDBY && id(cur_slot)!=pixizhi::SLOT_PIZZA) || id(overlay)>2) return;
          lv_obj_t *cv = id(overlay)==pixizhi::OVERLAY_NOTIFICATIONS ? id(notif_canvas) : id(overlay)==pixizhi::OVERLAY_TIMER ? id(timer_canvas)
              : id(cur_slot)==pixizhi::SLOT_PIZZA && id(ui_view)==pixizhi::VIEW_STANDBY ? id(pizza_canvas) : id(ui_canvas);
          if (cv == nullptr) return;
          if (!id(ui_ready)) return;
          lv_draw_buf_t *buf = lv_canvas_get_draw_buf(cv);
          if (buf == nullptr || buf->data == nullptr) return;
          const auto cf = buf->header.cf;
          if (cf != LV_COLOR_FORMAT_RGB565 && cf != LV_COLOR_FORMAT_ARGB8888) return;
          pixizhi::draw::Canvas canvas{buf->data, (int) buf->header.w, (int) buf->header.h, buf->header.stride,
              cf == LV_COLOR_FORMAT_RGB565 ? pixizhi::draw::RGB565 : pixizhi::draw::ARGB8888, id(is_night)()};
          static pixizhi::draw::UiState state;
          state = pixizhi::draw::UiState();
          id(ui_fill)(&state);
          pixizhi::draw::draw_frame(canvas, state);
          if (state.screen == pixizhi::draw::S_ALERTS)
            id(notification_line) = std::max(0, std::min(std::max(0, state.n_lines_total - 3), id(notification_line)));
          lv_obj_invalidate(cv);
  - id: clock_brightness_apply
    then:
      - lambda: |-
          // Three quarters of a turn spans the full brightness range.
          float value = id(gs_base_brightness) + id(gs_turn) / 4.712389f;
          value = fmaxf(0.05f, fminf(1.0f, value));
          id(gs_target_brightness) = value;
          if(id(is_night)()) {id(backlight_pwm).set_level(value);} else {
          auto call = id(screen_light).turn_on();
          call.set_brightness(value);
          call.set_transition_length(0);
          call.set_publish(false);  // Publish once on release, not every touch sample.
          call.set_save(false);
          call.perform();
          }
          id(clock_brightness_until) = millis()+1200;
          id(draw_dot_clock).execute();
      - script.execute: clock_brightness_hide
  - id: clock_brightness_hide
    mode: restart
    then:
      - delay: 1200ms
      - lambda: id(clock_brightness_until) = 0;
      - script.execute: draw_dot_clock
  - id: report_clock_rotation
    then:
      - lambda: |-
          if(id(is_night)()){auto night_call=id(night_brightness).make_call();night_call.set_value(id(gs_target_brightness)*100);night_call.perform();}
          else {
          auto call = id(screen_light).turn_on();
          // Commit the actual gesture result, never the previously published HA value.
          call.set_brightness(id(gs_target_brightness));
          call.set_publish(true);
          call.set_save(true);
          call.set_transition_length(0);
          call.perform();
          }
      - homeassistant.event:
          event: esphome.pixizhi_rotate
          data:
            node: ${name}
            direction: !lambda |-
              return std::string(id(gs_turn) >= 0 ? "clockwise" : "counterclockwise");
            brightness: !lambda return esphome::to_string((int) roundf(id(gs_target_brightness) * 100));
  - id: desk_play_pause
    then:
      - if:
          condition:
            lambda: return id(standby_player).rfind("media_player.", 0) == 0 && id(standby_state) == "playing";
          then:
            - homeassistant.action:
                action: media_player.media_play_pause
                data:
                  entity_id: !lambda return id(standby_player);
  - id: pulse_swipe_left
    mode: restart
    then:
      - binary_sensor.template.publish: { id: swipe_left, state: ON }
      - homeassistant.event:
          event: esphome.pixizhi_gesture
          data:
            node: ${name}
            gesture: swipe_left
      - delay: 200ms
      - binary_sensor.template.publish: { id: swipe_left, state: OFF }
  - id: pulse_swipe_right
    mode: restart
    then:
      - binary_sensor.template.publish: { id: swipe_right, state: ON }
      - homeassistant.event:
          event: esphome.pixizhi_gesture
          data:
            node: ${name}
            gesture: swipe_right
      - delay: 200ms
      - binary_sensor.template.publish: { id: swipe_right, state: OFF }
  - id: pulse_swipe_up
    mode: restart
    then:
      - binary_sensor.template.publish: { id: swipe_up, state: ON }
      - homeassistant.event:
          event: esphome.pixizhi_gesture
          data:
            node: ${name}
            gesture: swipe_up
      - delay: 200ms
      - binary_sensor.template.publish: { id: swipe_up, state: OFF }
  - id: pulse_swipe_down
    mode: restart
    then:
      - binary_sensor.template.publish: { id: swipe_down, state: ON }
      - homeassistant.event:
          event: esphome.pixizhi_gesture
          data:
            node: ${name}
            gesture: swipe_down
      - delay: 200ms
      - binary_sensor.template.publish: { id: swipe_down, state: OFF }

  - id: apply_backlight
    then:
      - lambda: |-
          const float level = id(is_night)() ? id(night_brightness).state / 100.0f :
              id(bl_requested) * (id(bl_dimmed) ? id(standby_brightness).state / 100.0f : 1.0f);
          id(backlight_pwm).set_level(fmaxf(0.0f, fminf(1.0f, level)));

  - id: update_clock
    then:
      - script.execute: apply_standby_style
      - script.execute: draw_dot_clock

  - id: apply_standby_style
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const bool night = id(is_night)();
          static bool themed = false;
          const bool changed = !themed || id(night_active) != night;
          themed = true;
          id(night_active) = night;
          // Color filters cover native LVGL controls (picker/pairing); canvases
          // also tint their pixels explicitly, since image pixels bypass text filters.
          static lv_color_filter_dsc_t red_filter = {
            [](const lv_color_filter_dsc_t *, lv_color_t c, lv_opa_t) -> lv_color_t {
              return lv_color_make(std::max({c.red,c.green,c.blue}), 0, 0);
            }, nullptr
          };
          auto tint = [&](auto &&self, lv_obj_t *o) -> void {
            lv_obj_set_style_color_filter_dsc(o, night ? &red_filter : nullptr, LV_PART_MAIN);
            lv_obj_set_style_color_filter_opa(o, night ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
            for (uint32_t i=0;i<lv_obj_get_child_count(o);i++) self(self,lv_obj_get_child(o,i));
          };
          lv_obj_t *roots[] = {id(standby_page)->obj,id(dashboard_page)->obj,id(colors_page)->obj,id(pizza_page)->obj,id(notif_page)->obj,id(timer_page)->obj,id(pairing_card)};
          if(changed){for(auto *o:roots)tint(tint,o);id(draw_wheel).execute();}
          id(apply_backlight).execute();
          id(draw_dot_clock).execute();
          id(ui_render).execute();

  - id: standby_long_press
    then:
      - if:
          condition:
            lambda: return id(longpress_mode).active_index().value_or(0) == 1;
          then:
            - script.execute: open_timer
          else:
            - homeassistant.event:
                event: esphome.pixizhi_long_press
                data:
                  node: ${name}
            - script.execute: draw_dot_clock
            - delay: 400ms
            - script.execute: apply_standby_style

  # ---------------- DOT MATRIX CLOCK ----------------
  - id: draw_dot_clock
    then:
      - lambda: id(clock_frame_dirty) = true;
  - id: clock_paint_frame
    then:
      - lambda: |-
          lv_obj_t *cv = id(dm_canvas);
          if (cv == nullptr) return;
          if (!id(ui_ready)) return;
          lv_draw_buf_t *buf = lv_canvas_get_draw_buf(cv);
          if (buf == nullptr || buf->data == nullptr) return;
          const auto cf = buf->header.cf;
          if (cf != LV_COLOR_FORMAT_RGB565 && cf != LV_COLOR_FORMAT_ARGB8888) return;
          pixizhi::draw::Canvas canvas{buf->data, (int) buf->header.w, (int) buf->header.h, buf->header.stride,
              cf == LV_COLOR_FORMAT_RGB565 ? pixizhi::draw::RGB565 : pixizhi::draw::ARGB8888, id(is_night)()};
          static pixizhi::draw::UiState state;
          state = pixizhi::draw::UiState();
          id(ui_fill)(&state);
          state.screen = pixizhi::draw::S_CLOCK;
          pixizhi::draw::draw_frame(canvas, state);
          lv_obj_invalidate(cv);

  - id: update_hint
    then:
      - script.execute: draw_dot_clock

  - id: update_now_playing
    then:
      - script.execute: draw_dot_clock

  - id: draw_wheel
    then:
      - lambda: |-
          lv_obj_t *cv = id(color_wheel);
          if (cv == nullptr) return;
          lv_draw_buf_t *buf = lv_canvas_get_draw_buf(cv);
          if (buf == nullptr || buf->data == nullptr) return;
          const auto cf = buf->header.cf;
          if (cf != LV_COLOR_FORMAT_RGB565 && cf != LV_COLOR_FORMAT_ARGB8888) return;
          const int bw = static_cast<int>(buf->header.w), bh = static_cast<int>(buf->header.h);
          const uint32_t stride = buf->header.stride;
          const bool frame_night = id(is_night)();
          auto put_pixel = [&](int x, int y, lv_color_t color, lv_opa_t alpha) {
            if (x < 0 || y < 0 || x >= bw || y >= bh) return;
            if (frame_night) color = lv_color_make(std::max({color.red,color.green,color.blue}),0,0);
            uint8_t *row = buf->data + static_cast<size_t>(y) * stride;
            if (cf == LV_COLOR_FORMAT_RGB565) {
              const uint16_t rgb = ((uint16_t)(color.red >> 3) << 11) |
                                   ((uint16_t)(color.green >> 2) << 5) | (color.blue >> 3);
              memcpy(row + x * 2, &rgb, sizeof(rgb));
            } else {
              uint8_t *pixel = row + x * 4;
              pixel[0] = color.blue; pixel[1] = color.green; pixel[2] = color.red; pixel[3] = alpha;
            }
          };

          lv_canvas_fill_bg(cv, lv_color_hex(0x000000), LV_OPA_TRANSP);
          const float R = 70.0f, C = 69.5f;
          for (int y = 0; y < 140; y++) {
            for (int x = 0; x < 140; x++) {
              float dx = x - C, dy = y - C;
              float r = sqrtf(dx * dx + dy * dy);
              if (r > R) continue;
              float hue = atan2f(dy, dx) * 57.29578f + 90.0f;
              if (hue < 0) hue += 360.0f;
              if (hue >= 360.0f) hue -= 360.0f;
              lv_color_t c = lv_color_hsv_to_rgb((uint16_t) hue, (uint8_t) (r / R * 100.0f), 100);
              lv_opa_t o = (r > R - 1.0f) ? (lv_opa_t) ((R - r) * 255.0f) : LV_OPA_COVER;
              put_pixel(x, y, c, o);
            }
          }
          lv_obj_invalidate(cv);

  # Read the finger position on the wheel and preview the color

  - id: wheel_pick
    then:
      - lambda: |-
          lv_indev_t *indev = lv_indev_active();
          if (indev == nullptr) return;
          lv_point_t p;
          lv_indev_get_point(indev, &p);
          lv_area_t a;
          lv_obj_get_coords(id(color_wheel), &a);
          float dx = p.x - (a.x1 + 69.5f), dy = p.y - (a.y1 + 69.5f);
          float r = sqrtf(dx * dx + dy * dy);
          if (r > 70.0f) r = 70.0f;
          float hue = atan2f(dy, dx) * 57.29578f + 90.0f;
          if (hue < 0) hue += 360.0f;
          if (hue >= 360.0f) hue -= 360.0f;
          lv_color_t c = lv_color_hsv_to_rgb((uint16_t) hue, (uint8_t) (r / 70.0f * 100.0f), 100);
          id(wheel_rgb) = (int) (lv_color_to_u32(c) & 0xFFFFFF);
          lv_obj_set_style_bg_color(id(colors_close), c, LV_PART_MAIN);

  # Advance: standby -> first picked screen -> ... -> last -> standby
  - id: go_next
    then:
      - lambda: |-
          int cur = id(cur_slot);
          int next = -1;
          if (cur < 6) {
            for (int i = cur + 1; i < 6; i++) {
              if (!id(slot_eid)[i].empty()) { next = i; break; }
            }
            if (next < 0 && id(show_pizza).state) next = 6;
          }
          id(cur_slot) = next;
      - script.execute: show_current

  - id: show_current
    then:
      - lambda: id(clock_brightness_until) = 0;
      - lambda: |-
          id(overlay) = pixizhi::OVERLAY_NONE;
          id(ui_view) = id(cur_slot) >= 0 && id(cur_slot) < 6 ? 2 : 0;
          id(ui_scroll_ms) = millis();
          id(ui_scroll_tick) = -1;
      - if:
          condition:
            lambda: return id(cur_slot) == pixizhi::SLOT_PIZZA;
          then:
            - lvgl.page.show: pizza_page
          else:
            - if:
                condition:
                  lambda: return id(cur_slot) < 0;
                then:
                  - lvgl.page.show: standby_page
                else:
                  - lvgl.page.show: dashboard_page
                  - script.execute: ui_render
      - script.execute: update_hint
      - script.execute: ui_render

  # Update only the currently visible canvas.
  - id: fill_current
    then:
      - script.execute: ui_render

  # --- Home Assistant actions ---
  - id: ha_rgb
    parameters:
      rgb: int
    then:
      - script.execute:
          id: ui_command
          slot: !lambda return id(cur_slot);
          kind: 7
          value: !lambda return static_cast<float>(rgb);
          option: ""
  - id: ha_kelvin
    parameters:
      kelvin: int
      preview: int
    then:
      - script.execute:
          id: ui_command
          slot: !lambda return id(cur_slot);
          kind: 8
          value: !lambda |-
            int s=id(cur_slot);
            if(s<0||s>=6)return 0.0f;
            return static_cast<float>(std::max(id(slot_kelvin_min)[s],std::min(id(slot_kelvin_max)[s],kelvin)));
          option: ""
  # Pizza screen: work out which slice the finger is on
  - id: pizza_hit
    then:
      - script.execute: ui_render

  - id: pizza_clear
    then:
      - lambda: id(pizza_sel) = -1;
      - script.execute: ui_render

  - id: pizza_fire
    then:
      - if:
          condition:
            lambda: return id(pizza_sel) >= 0;
          then:
            - homeassistant.event:
                event: esphome.pixizhi_pizza
                data:
                  node: ${name}
                  slice: !lambda return esphome::to_string(id(pizza_pg) * pixizhi::PIZZA_PAGE_SIZE + id(pizza_sel) + 1);

  # LED notification: flash, then put the LED back the way it was
  - id: flash_led
    mode: restart
    parameters:
      rgb: int
      count: int
      on_ms: int
      off_ms: int
    then:
      - lambda: |-
          if (!id(led_flashing)) id(led_saved) = id(led).remote_values;
          id(led_flashing) = true;
      - repeat:
          count: !lambda |-
            return count < 1 ? 1 : count;
          then:
            - light.turn_on:
                id: led
                brightness: 100%
                red: !lambda return ((rgb >> 16) & 0xFF) / 255.0f;
                green: !lambda return ((rgb >> 8) & 0xFF) / 255.0f;
                blue: !lambda return (rgb & 0xFF) / 255.0f;
                transition_length: 0s
            - delay: !lambda return on_ms;
            - light.turn_off:
                id: led
                transition_length: 0s
            - delay: !lambda return off_ms;
      - lambda: |-
          auto &v = id(led_saved);
          auto call = id(led).make_call();
          call.set_transition_length(0);
          if (v.is_on()) {
            call.set_state(true);
            call.set_brightness(v.get_brightness());
            call.set_rgb(v.get_red(), v.get_green(), v.get_blue());
          } else {
            call.set_state(false);
          }
          call.perform();
          id(led_flashing) = false;

  # ---------------- CHIME ----------------
  - id: play_chime
    then:
      - if:
          condition:
            lambda: return !id(siren).state;
          then:
            - media_player.repeat_off: ball_media_player
            - media_player.play_media:
                id: ball_media_player
                media_url: "audio-file://chime_sound"

  # wake the screen for an alert
  - id: wake_screen
    then:
      - lambda: |-
          id(bl_dimmed) = false;
          id(apply_backlight).execute();
          lv_display_trigger_activity(nullptr);

  # ---------------- NOTIFICATIONS ----------------
  - id: update_badge
    then:
      - script.execute: draw_dot_clock

  - id: notif_led
    then:
      - lambda: |-
          if (id(siren).state || id(led_flashing)) return;
          if (id(nq_title).empty()) {
            if (id(notif_led_on)) {
              auto call = id(led).turn_off();
              call.perform();
              id(notif_led_on) = false;
            }
            return;
          }
          bool urg = false;
          for (bool u : id(nq_urgent)) urg |= u;
          if (id(dnd).state && !urg) {
            if (id(notif_led_on)) { auto off = id(led).turn_off(); off.perform(); id(notif_led_on) = false; }
            return;
          }
          uint32_t c = urg ? 0xFF0000 : id(nq_color).back();
          auto call = id(led).turn_on();
          call.set_rgb(((c >> 16) & 0xFF) / 255.0f, ((c >> 8) & 0xFF) / 255.0f, (c & 0xFF) / 255.0f);
          call.set_brightness(urg ? 1.0f : 0.6f);
          call.set_effect(urg ? "Fast Pulse" : "None");
          call.perform();
          id(notif_led_on) = true;

  - id: open_notifications
    then:
      - if:
          condition:
            lambda: return !id(nq_title).empty();
          then:
            - lambda: id(overlay) = pixizhi::OVERLAY_NOTIFICATIONS; id(notification_line) = 0;
            - script.execute: notif_fill
            - lvgl.page.show:
                id: notif_page
                animation: FADE_IN
                time: 150ms

  - id: notif_fill
    then:
      - script.execute: ui_render

  - id: notif_dismiss
    parameters:
      held: bool
    then:
      - lambda: |-
          if (id(nq_title).empty()) return;
          if (id(nq_urgent)[0] && !held) return;
          id(nq_title).erase(id(nq_title).begin());
          id(nq_msg).erase(id(nq_msg).begin());
          id(nq_icon).erase(id(nq_icon).begin());
          id(nq_color).erase(id(nq_color).begin());
          id(nq_urgent).erase(id(nq_urgent).begin());
          id(nq_time).erase(id(nq_time).begin());
      - script.execute: nq_save
      - if:
          condition:
            lambda: return id(nq_title).empty();
          then:
            - script.execute: notif_closed
          else:
            - script.execute: notif_fill
            - script.execute: update_badge
            - script.execute: notif_led

  - id: notif_closed
    then:
      - script.execute: update_badge
      - script.execute: notif_led
      - if:
          condition:
            lambda: return id(overlay) == pixizhi::OVERLAY_NOTIFICATIONS;
          then:
            - lambda: id(cur_slot) = -1;
            - script.execute: show_current

  # urgent: wake up, show it, chime every minute until dismissed
  - id: urgent_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: |-
              for (bool u : id(nq_urgent)) if (u) return true;
              return false;
          then:
            - script.execute: wake_screen
            - if:
                condition:
                  lambda: return id(overlay) != pixizhi::OVERLAY_NOTIFICATIONS;
                then:
                  - script.execute: open_notifications
            - script.execute: play_chime
            - delay: 60s

  # ---------------- KITCHEN TIMER ----------------
  - id: open_timer
    then:
      - lambda: |-
          id(overlay) = pixizhi::OVERLAY_TIMER;
          if (!id(timer_running) && !id(timer_done) && id(timer_left) <= 0) id(timer_left) = id(timer_set_min) * 60;
      - script.execute: timer_ui
      - lvgl.page.show:
          id: timer_page
          animation: FADE_IN
          time: 150ms

  - id: timer_ui
    then:
      - script.execute: ui_render

  - id: timer_main
    then:
      - if:
          condition:
            lambda: return id(timer_done);
          then:
            - script.execute: timer_reset
          else:
            - lambda: |-
                if (id(timer_running)) id(timer_pause).execute();
                else if (id(timer_left) > 0) id(timer_start).execute(id(timer_left));
            - script.execute: timer_ui
            - script.execute: update_clock

  - id: timer_reset
    then:
      - script.stop: timer_alarm
      - lambda: |-
          bool was_done = id(timer_done);
          id(timer_running) = false;
          id(timer_done) = false;
          id(timer_left) = id(timer_set_min) * 60;
          id(timer_end_ms) = 0;
          id(timer_end_epoch) = 0;
          id(timer_paused_left) = 0;
          id(timer_publish).execute();
          if (was_done && !id(nq_title).empty()) id(notif_led).execute();
          else if (was_done) { auto call = id(led).turn_off(); call.perform(); }
      - if:
          condition:
            lambda: return !id(siren).state;
          then:
            - media_player.stop: ball_media_player
      - script.execute: timer_ui
      - script.execute: update_clock

  - id: timer_start
    parameters:
      seconds: int
    then:
      - lambda: |-
          id(timer_left) = std::max(1, (int) seconds);
          id(timer_end_ms) = millis() + (uint32_t) id(timer_left) * 1000;
          auto now = id(ha_time).now();
          id(timer_end_epoch) = now.is_valid() ? (uint32_t) now.timestamp + id(timer_left) : 0;
          id(timer_paused_left) = 0;
          id(timer_running) = true;
          id(timer_done) = false;
      - script.execute: timer_publish

  - id: timer_pause
    then:
      - lambda: |-
          id(timer_running) = false;
          id(timer_paused_left) = std::max(1, id(timer_left));
          id(timer_end_ms) = 0;
          id(timer_end_epoch) = 0;
      - script.execute: timer_publish

  # Recompute from the end time instead of counting ticks, so the timer never drifts.
  - id: timer_tick
    then:
      - lambda: |-
          if (!id(timer_running) || id(timer_end_ms) == 0) return;
          int32_t ms = (int32_t)(id(timer_end_ms) - millis());
          id(timer_left) = ms <= 0 ? 0 : (ms + 999) / 1000;
          if (id(timer_left) <= 0) {
            id(timer_running) = false;
            id(timer_done) = true;
            id(timer_end_ms) = 0;
            id(timer_end_epoch) = 0;
            id(timer_paused_left) = 0;
            id(timer_publish).execute();
          }

  # After a reboot: resume a running timer once the clock is valid, or a paused one at once.
  - id: timer_restore
    then:
      - lambda: |-
          if (id(timer_running) || id(timer_done)) return;
          if (id(timer_paused_left) > 0) {
            id(timer_left) = id(timer_paused_left);
            id(timer_publish).execute();
            return;
          }
          if (id(timer_end_epoch) == 0) return;
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          int left = pixizhi::timer_remaining(id(timer_end_epoch), (uint32_t) now.timestamp);
          if (left > 0) {
            id(timer_left) = left;
            id(timer_end_ms) = millis() + (uint32_t) left * 1000;
            id(timer_running) = true;
          } else {
            // It expired while the device was off: ring now so it is not silently lost.
            id(timer_left) = 1;
            id(timer_end_ms) = millis();
            id(timer_running) = true;
          }
          id(timer_publish).execute();

  - id: timer_publish
    then:
      - lambda: |-
          if (id(timer_running) && id(timer_end_epoch) != 0) {
            time_t t = (time_t) id(timer_end_epoch);
            struct tm g; gmtime_r(&t, &g);
            char b[32]; strftime(b, sizeof(b), "%Y-%m-%dT%H:%M:%S+00:00", &g);
            id(timer_ends_sensor).publish_state(b);
          } else {
            id(timer_ends_sensor).publish_state("unknown");
          }
          id(timer_state_sensor).publish_state(id(timer_done) ? "done" : id(timer_running) ? "running" :
              id(timer_paused_left) > 0 ? "paused" : "idle");

  # Redraw both screens immediately when the API link drops or returns.
  # Onboarding card: Wi-Fi setup hotspot first, then "add to Home Assistant".
  - id: setup_card_update
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          auto *w = wifi::global_wifi_component;
          int want = 0;
          // Setup only before Wi-Fi is configured; a later router outage shows "WIFI OFFLINE" instead.
          if (!w->is_connected() && w->is_ap_active() && (!w->has_sta() || !id(ha_adopted))) want = 1;
          else if (w->is_connected() && !id(ha_adopted) && !api::global_api_server->is_connected())
            want = id(setup_state) == 3 ? 3 : 2;
          if (id(setup_state) == 3 && want != 1) want = id(ha_adopted) ? 0 : 3;
          static std::string last_ip;
          std::string ip;
          if (want == 2) for (auto &a : w->get_ip_addresses()) if (a.is_ip4()) { char b[48]; ip = a.str_to(b); break; }
          if (want == id(setup_state) && ip == last_ip) return;
          id(setup_state) = want;
          last_ip = ip;
          if (want == 1) {
            lv_label_set_text(id(setup_heading), "PIXIZHI SETUP");
            lv_obj_clear_flag(id(setup_qr), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(setup_big), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(setup_hide), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(setup_hint), "Scan to join PixiZhi Setup, then choose your Wi-Fi");
          } else if (want == 2) {
            lv_label_set_text(id(setup_heading), "WI-FI OK");
            lv_obj_add_flag(id(setup_qr), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(setup_big), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(setup_hide), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(setup_big), ip.empty() ? "CONNECTED" : ip.c_str());
            lv_label_set_text(id(setup_hint), "Home Assistant: Settings > Devices > Discovered > PixiZhi > Add");
          }
          if (want == 1 || want == 2) {
            lv_obj_clear_flag(id(setup_card), LV_OBJ_FLAG_HIDDEN);
            id(gs_touch_active) = false;
            id(bl_dimmed) = false;
            id(apply_backlight).execute();
          } else {
            lv_obj_add_flag(id(setup_card), LV_OBJ_FLAG_HIDDEN);
          }

  # Shows queued planes one after another, 15 s each, then returns.
  - id: plane_try_start
    then:
      - if:
          condition:
            lambda: |-
              return !id(plane_active) && !id(plane_queue).empty() && id(plane_spotting).state && id(ui_ready) &&
                id(overlay) == pixizhi::OVERLAY_NONE && !(id(ui_view) == pixizhi::VIEW_STANDBY && id(cur_slot) >= 0 && id(cur_slot) < 6) &&
                !id(siren_active) && id(setup_state) != 1 && id(setup_state) != 2 && !id(sendspin_pairing_visible);
          then:
            - lambda: |-
                id(plane_prev_view) = id(ui_view);
                id(plane_prev_slot) = id(cur_slot);
                id(plane_active) = true;
                id(plane_idx) = 0;
                id(plane_start_ms) = millis();
                id(ui_view) = pixizhi::VIEW_PLANE;
                id(ui_scroll_ms) = millis();
            - lvgl.page.show: dashboard_page
            - script.execute: wake_screen
            - script.execute: ui_render

  - id: plane_end
    then:
      - if:
          condition:
            lambda: return id(plane_active);
          then:
            - lambda: |-
                id(plane_active) = false;
                id(plane_queue).clear();
                id(cur_slot) = id(plane_prev_slot);
            - if:
                condition:
                  lambda: return id(ui_view) == pixizhi::VIEW_PLANE && id(plane_prev_view) != pixizhi::VIEW_STANDBY && id(plane_prev_view) != pixizhi::VIEW_PLANE;
                then:
                  - script.execute:
                      id: ui_open
                      view: !lambda return id(plane_prev_view);
                else:
                  - if:
                      condition:
                        lambda: return id(ui_view) == pixizhi::VIEW_PLANE;
                      then:
                        - script.execute: show_current
          else:
            - lambda: id(plane_queue).clear();

  - id: quick_tile
    parameters:
      tile: int
    then:
      - lambda: |-
          if (tile == 0) {
            static const int levels[] = {25, 50, 75, 100};
            int cur = id(is_night)() ? (int) id(night_brightness).state : (int) roundf(id(screen_light).remote_values.get_brightness() * 100);
            int next = 25;
            for (int l : levels) if (l > cur + 2) { next = l; break; }
            if (cur >= 98) next = 25;
            if (id(is_night)()) { auto c = id(night_brightness).make_call(); c.set_value(next); c.perform(); }
            else { auto c = id(screen_light).turn_on(); c.set_brightness(next / 100.0f); c.perform(); }
          } else if (tile == 1) {
            int cur = (int) roundf(id(ball_media_player).volume * 100);
            int next = cur >= 100 ? 0 : std::min(100, (cur / 20 + 1) * 20);
            auto c = id(ball_media_player).make_call(); c.set_volume(next / 100.0f); c.perform();
          } else if (tile == 2) {
            id(night_mode).toggle();
          } else if (tile == 3) {
            id(dnd).toggle();
          } else if (tile == 4) {
            auto c = id(audio_output).make_call();
            c.set_index(id(audio_output).active_index().value_or(0) == 1 ? 0 : 1);
            c.perform();
          } else if (tile == 5) {
            id(open_timer).execute();
          }
      - script.execute: ui_render

  - id: link_changed
    then:
      - script.execute: draw_dot_clock
      - script.execute: ui_render

  - id: nq_save
    then:
      - lambda: |-
          std::vector<pixizhi::StoredNotification> items;
          for (size_t i = 0; i < id(nq_title).size(); i++) {
            pixizhi::StoredNotification n;
            n.title = id(nq_title)[i]; n.msg = id(nq_msg)[i]; n.icon = id(nq_icon)[i];
            n.color = id(nq_color)[i]; n.urgent = id(nq_urgent)[i]; n.epoch = id(nq_time)[i];
            items.push_back(n);
          }
          std::array<char, pixizhi::NQ_STORE_SIZE> buf{};
          pixizhi::nq_serialize(items, buf.data(), buf.size());
          if (buf != id(nq_store)) id(nq_store) = buf;  // write flash only on change

  - id: nq_restore
    then:
      - lambda: |-
          auto items = pixizhi::nq_deserialize(id(nq_store).data(), id(nq_store).size());
          for (auto &n : items) {
            id(nq_title).push_back(n.title); id(nq_msg).push_back(n.msg); id(nq_icon).push_back(n.icon);
            id(nq_color).push_back(n.color); id(nq_urgent).push_back(n.urgent); id(nq_time).push_back(n.epoch);
          }
      - if:
          condition:
            lambda: return !id(nq_title).empty();
          then:
            - script.execute: update_badge
            - script.execute: notif_led
            - if:
                condition:
                  lambda: |-
                    for (bool u : id(nq_urgent)) if (u) return true;
                    return false;
                then:
                  - script.execute: urgent_loop

  - id: timer_alarm
    mode: restart
    then:
      - homeassistant.event:
          event: esphome.pixizhi_timer_done
      - script.execute: wake_screen
      - script.execute: open_timer
      - light.turn_on:
          id: led
          brightness: 100%
          red: 11%
          green: 100%
          blue: 33%
          effect: Fast Pulse
      - repeat:
          count: 12
          then:
            - if:
                condition:
                  lambda: return id(timer_done);
                then:
                  - script.execute: play_chime
            - delay: 5s
      - if:
          condition:
            lambda: return id(timer_done);
          then:
            - script.execute: timer_reset

  # Keep this separate from audio routing: disabling the diagnostic switch
  # resumes display rendering without stopping or restarting playback.
  - id: audio_display_policy
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const bool audio_active = !id(box_speaker).is_stopped() ||
              id(ball_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
          const bool pause = id(pause_display_during_audio).state && audio_active && !id(sendspin_pairing_visible);
          if (pause) {
            // Touch input can wake LVGL; reassert only this optional test policy.
            if (!id(lvgl_comp).is_paused()) id(lvgl_comp).set_paused(true, false);
            id(audio_display_paused) = true;
          } else if (id(audio_display_paused)) {
            id(lvgl_comp).set_paused(false, false);
            id(audio_display_paused) = false;
            id(ui_frame_dirty) = true;
            id(clock_frame_dirty) = true;
            lv_obj_invalidate(lv_screen_active());
          }

  - id: enter_deep_standby
    then:
      - logger.log: "Entering deep standby; touch to wake"
      - lambda: |-
          id(nq_save).execute();
          global_preferences->sync();
          id(backlight_pwm).set_level(0);
      - light.turn_off:
          id: led
          transition_length: 0s
      - switch.turn_off: speaker_enable
      - delay: 200ms
      - deep_sleep.enter: deep_standby

  # Replays the siren file until stopped. Does not depend on media repeat support.
  - id: siren_loop
    mode: restart
    then:
      - media_player.stop: ball_media_player
      - delay: 300ms
      - script.execute: apply_audio_output
      - script.wait: apply_audio_output
      - media_player.unmute: ball_media_player
      - media_player.volume_set:
          id: ball_media_player
          volume: 100%
      - while:
          condition:
            lambda: return id(siren_active);
          then:
            - media_player.play_media:
                id: ball_media_player
                media_url: "audio-file://siren_sound"
            # Give the pipeline time to start, then wait for the clip to end.
            - wait_until:
                condition:
                  lambda: return id(ball_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
                timeout: 2s
            - wait_until:
                condition:
                  lambda: return id(ball_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;
                timeout: 60s
            - delay: 100ms

  - id: media_player_stop_for_update
    then:
      - switch.turn_off: siren
      - media_player.stop: ball_media_player

  - id: siren_show
    then:
      - lambda: |-
          lv_obj_clear_flag(id(siren_card), LV_OBJ_FLAG_HIDDEN);
          id(gs_touch_active) = false;
          id(lvgl_comp).set_paused(false, false);
      - script.execute: wake_screen

  # Safety stop: the siren switches itself off after "Siren Max Duration"
  - id: siren_timeout
    mode: restart
    then:
      - delay: !lambda return (uint32_t) (id(siren_max_duration).state * 1000);
      - switch.turn_off: siren


interval:
  - interval: 250ms
    then:
      - script.execute: audio_display_policy
  # Siren volume lock: undo volume or mute changes from HA or anywhere else.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return id(siren_active) &&
                (id(ball_media_player).volume < 0.999f || id(ball_media_player).is_muted());
          then:
            - media_player.unmute: ball_media_player
            - media_player.volume_set:
                id: ball_media_player
                volume: 100%
  - interval: 1s
    then:
      - script.execute: setup_card_update
  # Plane screen: start, advance every 15 s, redraw the countdown ring.
  - interval: 250ms
    then:
      - lambda: |-
          if (!id(plane_active)) { if (!id(plane_queue).empty()) id(plane_try_start).execute(); return; }
          if (id(ui_view) != pixizhi::VIEW_PLANE) { id(plane_active) = false; id(plane_queue).clear(); return; }
          if ((uint32_t)(millis() - id(plane_start_ms)) >= 15000) {
            id(plane_idx)++;
            id(plane_start_ms) = millis();
            id(ui_scroll_ms) = millis();
            if (id(plane_idx) >= (int) id(plane_queue).size()) { id(plane_end).execute(); return; }
          }
          id(ui_render).execute();
  - interval: 250ms
    then:
      - lambda: |-
          static uint32_t waiting_since = 0;
          const bool selected_usb = id(audio_output).active_index().value_or(0) == 1;
          const bool pending_audio = !id(usb_speaker).is_stopped() ||
            id(media_mixer_input).has_buffered_data() || id(announcement_mixer_input).has_buffered_data();
          if (!id(ui_ready) || id(siren_active) || !id(usb_audio_fallback).state || !selected_usb ||
              !pending_audio || id(usb_speaker).is_running()) {
            waiting_since = 0;
            return;
          }
          const uint32_t now = millis();
          if (waiting_since == 0) { waiting_since = now; return; }
          if ((uint32_t)(now - waiting_since) < 3000) return;
          waiting_since = 0;
          ESP_LOGW("audio_route", "USB speaker not running after 3 seconds; selecting internal speaker");
          id(ui_message) = "USB NOT READY";
          id(ui_message_until) = now + 2500;
          id(ui_render).execute();
          auto call = id(audio_output).make_call();
          call.set_index(0);
          call.perform();
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(ui_ready) || id(overlay)>2 || id(audio_display_paused)) return;
          // A black standby screen needs no frames; dirty flags repaint on wake.
          if (id(bl_dimmed) && id(standby_brightness).state <= 0 && !id(is_night)()) return;
          // Keep the newest dirty frame; coalesce intermediate audio-time updates.
          static uint32_t last_frame = 0;
          const uint32_t now = millis();
          const bool audio_active = !id(box_speaker).is_stopped() ||
              id(ball_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
          if (audio_active && (uint32_t)(now - last_frame) < 100) return;
          last_frame = now;
          if (id(ui_view) != pixizhi::VIEW_STANDBY || id(overlay)==pixizhi::OVERLAY_NOTIFICATIONS || id(overlay)==pixizhi::OVERLAY_TIMER || id(cur_slot)==pixizhi::SLOT_PIZZA) {
            if (id(ui_frame_dirty)) {
              id(ui_frame_dirty) = false;
              id(ui_paint_frame).execute();
            }
          } else if (id(cur_slot) < 0 && id(clock_frame_dirty)) {
            id(clock_frame_dirty) = false;
            id(clock_paint_frame).execute();
          }
  - interval: 200ms
    then:
      - lambda: |-
          if(!id(ui_ready))return;
          uint32_t now=millis();bool repaint=false;
          if(id(ui_view)==pixizhi::VIEW_STANDBY && id(cur_slot)<0 && id(overlay)==pixizhi::OVERLAY_NONE && id(standby_music_enabled) && id(standby_state)=="playing") id(draw_dot_clock).execute();
          for(int s=0;s<6;s++) {
            if(id(slot_temp_due)[s] && (int32_t)(now-id(slot_temp_due)[s])>=0) {
              id(slot_temp_due)[s]=0;id(ui_command).execute(s,4,id(slot_expected)[s],"");
            }
            if(id(slot_pending)[s] && (uint32_t)(now-id(slot_command_ms)[s])>7000) {
              id(slot_pending)[s]=0;id(ui_message)="NO CONFIRMATION";id(ui_message_until)=now+2500;repaint=true;
            }
          }
          if(id(ui_message_until) && (int32_t)(now-id(ui_message_until))>=0) {id(ui_message_until)=0;id(ui_message)="";repaint=true;}
          if(id(ui_view)!=pixizhi::VIEW_STANDBY && id(overlay)==pixizhi::OVERLAY_NONE && !id(gs_touch_active)) {
            int tick=(now-id(ui_scroll_ms))/220;
            // Only redraw a changing marquee, not every idle page.
            int s=id(cur_slot);bool scroll=id(ui_view)==pixizhi::VIEW_STATUS_DETAIL || (id(ui_view)==pixizhi::VIEW_SLOT&&s>=0&&s<6&&id(slot_eid)[s].rfind("media_player.",0)==0 && (id(slot_title)[s].size()>15||id(slot_artist)[s].size()>15));
            if(scroll&&tick!=id(ui_scroll_tick)){id(ui_scroll_tick)=tick;repaint=true;}
            static uint32_t music_frame=0;
            if(id(ui_view)==pixizhi::VIEW_SLOT&&s>=0&&s<6&&id(slot_eid)[s].rfind("media_player.",0)==0&&id(slot_state)[s]=="playing"&&now/400!=music_frame){music_frame=now/400;repaint=true;}
            static uint32_t last_status=0;if(now-last_status>5000){last_status=now;repaint=true;}
            if(repaint)id(ui_render).execute();
          }
  - interval: 250ms
    then:
      - lambda: |-
          if (!id(ui_ready) || id(ui_view) != pixizhi::VIEW_STANDBY || id(cur_slot) >= 0 || id(overlay) != pixizhi::OVERLAY_NONE || id(gs_touch_active)) return;
          if (id(bl_dimmed) && id(standby_brightness).state <= 0 && !id(is_night)()) return;
          bool redraw = false;
          uint32_t now = millis();
          if ((uint32_t)(now - id(status_last_ms)) >= (uint32_t)id(status_seconds) * 1000) {
            id(status_last_ms) = now;
            // -1 is weather; each active status gets a turn, then weather returns.
            std::vector<int> active;
            for(int i=0;i<6;i++)if(id(status_active)[i])active.push_back(i);
            std::stable_sort(active.begin(),active.end(),[&](int a,int b){return id(status_priority)[a]>id(status_priority)[b];});
            int next=-1;
            if(id(status_row)<0){if(!active.empty())next=active.front();}
            else for(size_t j=0;j+1<active.size();j++)if(active[j]==id(status_row)){next=active[j+1];break;}
            id(status_row)=next;
            redraw = true;
          }
          if (id(status_row) >= 0 && !id(status_active)[id(status_row)]) {
            id(status_row) = -1;
            redraw = true;
          }
          // Four small weather frames over two seconds, once every 90 seconds.
          uint32_t phase = now % 90000;
          int frame = id(weather_animate) && !id(is_night)() && id(status_row) < 0 && phase < 2000
                      ? (int)(phase / 500) : 0;
          if (frame != id(weather_frame)) { id(weather_frame) = frame; redraw = true; }
          if (redraw) id(draw_dot_clock).execute();
  - interval: 1s
    then:
      - lambda: |-
          if (id(ui_ready) && id(night_active) != id(is_night)()) id(apply_standby_style).execute();
      - if:
          condition:
            lambda: |-
              if (!id(bl_dimmed)) { id(dimmed_since) = 0; return false; }
              if (id(dimmed_since) == 0) id(dimmed_since) = millis();
              const float minutes = id(deep_standby_after).state;
              if (!(minutes > 0) || id(battery_charging).state || id(audio_busy)() || id(timer_running) ||
                  id(timer_done) || id(siren).state || id(sendspin_pairing_visible) || id(gs_touch_active) ||
                  !id(ha_adopted)) return false;
              for (bool u : id(nq_urgent)) if (u) return false;
              return (uint32_t)(millis() - id(dimmed_since)) >= (uint32_t)(minutes * 60000.0f);
          then:
            - script.execute: enter_deep_standby
      - if:
          condition:
            lambda: return id(timer_running);
          then:
            - script.execute: timer_tick
            - lambda: |-
                if (id(overlay) == pixizhi::OVERLAY_TIMER) id(timer_ui).execute();
                if (id(overlay) == pixizhi::OVERLAY_NONE && id(cur_slot) < 0)
                  id(draw_dot_clock).execute();
            - if:
                condition:
                  lambda: return id(timer_done);
                then:
                  - script.execute: timer_alarm
                  - script.execute: update_clock
  - interval: 600ms
    then:
      - lambda: |-
          if (id(overlay) != pixizhi::OVERLAY_NOTIFICATIONS || id(nq_title).empty() || !id(nq_urgent)[0]) return;
          id(pulse_phase) = !id(pulse_phase);
          id(ui_render).execute();

# --- USER INTERFACE (LVGL) ------------------------------------------------------
lvgl:
  id: lvgl_comp
  displays:
    - main_display
  touchscreens:
    - my_touchscreen
  buffer_size: 25%
  bg_color: 0x000000
  text_color: 0xFFFFFF
  default_font: pixel_small

  on_idle:
    timeout: !lambda return (uint32_t) (id(screen_timeout).state * 1000);
    then:
      - if:
          condition:
            lambda: return !id(sendspin_pairing_visible) && id(setup_state)!=1 && id(setup_state)!=2 && !id(siren_active) && !id(gs_touch_active) && !id(bl_dimmed) && !(id(overlay) == pixizhi::OVERLAY_NOTIFICATIONS && !id(nq_urgent).empty() && id(nq_urgent)[0]) && !id(timer_done);
          then:
            - lambda: |-
                id(cur_slot) = -1;
                id(overlay) = pixizhi::OVERLAY_NONE;
                id(bl_dimmed) = true;
            - script.execute: show_current
            - script.execute: apply_backlight

  style_definitions:
    - id: big_arc
      arc_width: 14
      arc_rounded: true
    - id: nav_zone
      bg_color: 0x202020
      bg_opa: 80%
      radius: 16
      border_width: 0
      shadow_width: 0
    - id: swatch
      width: 26
      height: 26
      radius: 13
      border_width: 1
      border_color: 0x808080
      shadow_width: 0
      pad_all: 0

  # Modal above every page; underlying navigation is suppressed while visible.
  top_layer:
    widgets:
      - obj:
          id: siren_card
          hidden: true
          align: CENTER
          width: 240
          height: 240
          bg_color: 0x400000
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          radius: 0
          scrollable: false
          clickable: true
          widgets:
            - label:
                align: CENTER
                y: -50
                text: SIREN
                text_font: pixel_large
                text_color: 0xFF2A2A
            - button:
                align: CENTER
                y: 30
                width: 140
                height: 64
                radius: 32
                bg_color: 0xFF2A2A
                widgets:
                  - label:
                      align: CENTER
                      text: STOP
                      text_font: pixel_medium
                      text_color: 0x000000
                on_click:
                  - switch.turn_off: siren
      - obj:
          id: update_card
          hidden: true
          align: CENTER
          width: 240
          height: 240
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          radius: 0
          scrollable: false
          clickable: true
          widgets:
            - label:
                align: CENTER
                y: -62
                text: UPDATING
                text_font: pixel_medium
                text_color: 0xFFB000
            - label:
                id: update_pct
                align: CENTER
                y: -8
                text: "0%"
                text_font: pixel_large
                text_color: 0xFFFFFF
            - bar:
                id: update_bar
                align: CENTER
                y: 40
                width: 160
                height: 10
                min_value: 0
                max_value: 100
                value: 0
                bg_color: 0x303030
                indicator:
                  bg_color: 0xFFB000
            - label:
                id: update_note
                align: CENTER
                y: 72
