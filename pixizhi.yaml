      - obj:
          id: setup_card
          hidden: true
          align: CENTER
          width: 240
          height: 240
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          radius: 0
          scrollable: false
          clickable: true
          widgets:
            - label:
                id: setup_heading
