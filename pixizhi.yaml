  - id: apply_backlight
    then:
      - lambda: |-
          const float level = id(is_night)() ? id(night_brightness).state / 100.0f :
              id(bl_requested) * (id(bl_dimmed) ? id(standby_brightness).state / 100.0f : 1.0f);
          id(backlight_pwm).set_level(fmaxf(0.0f, fminf(1.0f, level)));

  - id: update_clock
    then:
      - script.execute: apply_standby_style
      - script.execute: draw_dot_clock

  - id: apply_standby_style
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const bool night = id(is_night)();
          static bool themed = false;
          const bool changed = !themed || id(night_active) != night;
          themed = true;
          id(night_active) = night;
          // Color filters cover native LVGL controls (picker/pairing); canvases
          // also tint their pixels explicitly, since image pixels bypass text filters.
          static lv_color_filter_dsc_t red_filter = {
            [](const lv_color_filter_dsc_t *, lv_color_t c, lv_opa_t) -> lv_color_t {
              return lv_color_make(std::max({c.red,c.green,c.blue}), 0, 0);
            }, nullptr
          };
          auto tint = [&](auto &&self, lv_obj_t *o) -> void {
            lv_obj_set_style_color_filter_dsc(o, night ? &red_filter : nullptr, LV_PART_MAIN);
            lv_obj_set_style_color_filter_opa(o, night ? LV_OPA_COVER : LV_OPA_TRANSP, LV_PART_MAIN);
            for (uint32_t i=0;i<lv_obj_get_child_count(o);i++) self(self,lv_obj_get_child(o,i));
          };
          lv_obj_t *roots[] = {id(standby_page)->obj,id(dashboard_page)->obj,id(colors_page)->obj,id(pizza_page)->obj,id(notif_page)->obj,id(timer_page)->obj,id(pairing_card)};
          if(changed){for(auto *o:roots)tint(tint,o);id(draw_wheel).execute();}
          id(apply_backlight).execute();
          id(draw_dot_clock).execute();
          id(ui_render).execute();

  - id: standby_long_press
