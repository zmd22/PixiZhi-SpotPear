        {"home", "\U000F02DC"}, {"fire", "\U000F0238"}, {"coffee", "\U000F0176"},
        {"star", "\U000F04CE"}, {"bell", "\U000F009A"}, {"door", "\U000F081A"},
        {"window", "\U000F05B1"}, {"washer", "\U000F072A"}, {"package", "\U000F03D7"},
        {"battery", "\U000F0083"}, {"alert", "\U000F0026"}, {"info", "\U000F02FC"},
        {"check", "\U000F05E0"}, {"water", "\U000F058C"}, {"mail", "\U000F06EE"},
        {"timer", "\U000F051B"}
      }
  - id: siren_prev_volume
    type: float
    initial_value: "0.5"
  - id: siren_active
    type: bool
    initial_value: "false"
  - id: ui_ready
    type: bool
    initial_value: "false"
  - id: is_night
    type: std::function<bool()>
    initial_value: |-
      []() -> bool {
        if (!id(night_mode).state) return false;
        auto now = id(ha_time).now();
        if (!now.is_valid()) return false;
        int n = now.hour * 3600 + now.minute * 60 + now.second;
        int a = id(night_start).hour * 3600 + id(night_start).minute * 60 + id(night_start).second;
        int b = id(night_end).hour * 3600 + id(night_end).minute * 60 + id(night_end).second;
        if (a == b) return false;
        return (a < b) ? (n >= a && n < b) : (n >= a || n < b);
      }
  # True only while the API link is up and the blueprint has synced recently.
  - id: audio_busy
    type: std::function<bool()>
    initial_value: |-
      []() -> bool {
        return !id(box_speaker).is_stopped() ||
          id(ball_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
          id(ball_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
      }
  - id: battery_low
    type: std::function<bool()>
    initial_value: |-
      []() -> bool {
        auto p = id(battery_percentage).state;
        return !std::isnan(p) && p <= id(low_battery_level).state && !id(battery_charging).state;
      }
  - id: dimmed_since
    type: uint32_t
    initial_value: "0"
  # Set once Home Assistant has connected; hides the "add to HA" card for good.
  - id: ha_adopted
    type: bool
    restore_value: true
    initial_value: "false"
  # 0 hidden, 1 Wi-Fi setup, 2 add to Home Assistant, 3 dismissed for this boot
  - id: setup_state
    type: int
    initial_value: "0"
  - id: ha_online
    type: std::function<bool()>
    initial_value: |-
      []() -> bool {
        if (!api::global_api_server->is_connected()) return false;
        return id(ui_last_sync) != 0 && (uint32_t)(millis() - id(ui_last_sync)) <= pixizhi::HA_STALE_MS;
      }
  # Snapshot of everything the renderer needs (see pixizhi_draw.h).
  - id: ui_fill
    # void* because globals are declared before the headers are included.
    type: std::function<void(void*)>
    initial_value: |-
      [](void *out) {
        using namespace pixizhi::draw;
        UiState &s = *static_cast<UiState *>(out);
        const uint32_t now = millis();
        int ci = id(clock_color).active_index().value_or(THEME_DEFAULT);
        s.accent = rgb(THEME_COLORS[std::max(0, std::min(THEME_COLOR_COUNT - 1, ci))].rgb);
        s.scroll_ms = now - id(ui_scroll_ms);
        s.anim_ms = now;
        s.ha_online = id(ha_online)();
        s.wifi_online = wifi::global_wifi_component->is_connected();
        if (!id(ui_message).empty() && (int32_t)(id(ui_message_until) - now) > 0) s.message = id(ui_message);
        auto t = id(ha_time).now();
        s.time_valid = t.is_valid(); s.hour = t.hour; s.minute = t.minute;
        s.weather_ok = id(w_ok); s.weather_cond = id(w_cond); s.weather_temp = id(w_temp); s.weather_frame = id(weather_frame);
        s.status_row = id(status_row);
        s.desk_temp = id(desk_temp); s.desk_rh = id(desk_rh);
        s.music_line = id(standby_music_enabled) && id(standby_state) == "playing" && !id(standby_title).empty();
        s.music_title = id(standby_title); s.music_artist = id(standby_artist);
        s.alert_count = id(nq_title).size();
        s.battery = id(battery_percentage).state;
        s.charging = id(battery_charging).state;
        s.battery_ring = id(battery_ring).state;
        s.battery_low = id(battery_low)();
        s.brightness_feedback = (int32_t)(id(clock_brightness_until) - now) > 0 ? (int) roundf(id(gs_target_brightness) * 100) : -1;
        for (int i = 0; i < 6; i++) {
          auto &v = s.slots[i];
          v.eid = id(slot_eid)[i]; v.label = id(slot_label)[i]; v.state = id(slot_state)[i];
          v.title = id(slot_title)[i]; v.artist = id(slot_artist)[i]; v.action = id(slot_action)[i]; v.unit = id(slot_unit)[i];
          v.modes = id(slot_modes)[i]; v.presets = id(slot_presets)[i]; v.sources = id(slot_sources)[i]; v.repeat = id(slot_repeat)[i];
          v.stale = id(slot_seen)[i] == 0 || (uint32_t)(now - id(slot_seen)[i]) > pixizhi::HA_STALE_MS;
          v.available = !v.stale && v.state != "unavailable" && v.state != "unknown";
          v.dimmable = id(slot_dimmable)[i]; v.color = id(slot_color_capable)[i]; v.white = id(slot_white)[i];
          v.muted = id(slot_muted)[i]; v.shuffle = id(slot_shuffle)[i];
          v.pending = id(slot_pending)[i]; v.features = id(slot_features)[i]; v.bri = id(slot_bri)[i];
          v.expected = id(slot_expected)[i]; v.vol = id(slot_vol)[i]; v.tnow = id(slot_tnow)[i]; v.ttarget = id(slot_ttarget)[i];
          v.tmin = id(slot_tmin)[i]; v.tmax = id(slot_tmax)[i]; v.step = id(slot_step)[i];
          auto &st = s.status[i];
          st.label = id(status_labels)[i]; st.icon = id(status_icons)[i]; st.value = id(status_value)[i];
          st.target = id(status_target)[i]; st.active = id(status_active)[i]; st.priority = id(status_priority)[i];
        }
        s.cur_slot = id(cur_slot); s.category = id(ui_category); s.list_offset = id(ui_list_offset);
        s.status_detail = id(ui_status_detail);
        s.dragging = id(gs_rotating) && id(gs_touch_active); s.dial_value = id(ui_dial_value); s.volume_limit = id(ui_volume_limit);
        s.n_count = id(nq_title).size();
        if (s.n_count > 0) {
          s.n_title = id(nq_title)[0]; s.n_msg = id(nq_msg)[0]; s.n_icon = id(nq_icon)[0];
          s.n_color = id(nq_color)[0]; s.n_urgent = id(nq_urgent)[0];
          s.n_age = pixizhi::age_label(id(nq_time)[0], t.is_valid() ? (uint32_t) t.timestamp : 0);
        }
        s.n_line = id(notification_line);
        s.timer_left = id(timer_left); s.timer_set_min = id(timer_set_min);
        s.timer_running = id(timer_running); s.timer_done = id(timer_done);
        for (int k = 0; k < 12; k++) { s.pizza_labels[k] = id(pizza_labels)[k]; s.pizza_keys[k] = id(pizza_keys)[k]; }
        s.pizza_pages = id(pizza_page_count)();
        s.pizza_page = std::min(id(pizza_pg), s.pizza_pages - 1);
        s.pizza_sel = id(pizza_sel);
        s.q_brightness = id(is_night)() ? (int) id(night_brightness).state
            : (int) roundf(id(screen_light).remote_values.get_brightness() * 100);
        s.q_volume = (int) roundf(id(ball_media_player).volume * 100);
        s.q_night = id(night_mode).state; s.q_dnd = id(dnd).state;
        s.q_usb = id(audio_output).active_index().value_or(0) == 1;
        if (id(plane_active) && id(plane_idx) < (int) id(plane_queue).size()) {
          const auto &p = id(plane_queue)[id(plane_idx)];
          s.p_model = p[0]; s.p_flight = p[1]; s.p_airline = p[2]; s.p_origin = p[3]; s.p_dest = p[4]; s.p_callsign = p[5];
          std::string home = id(home_airport).state;
          for (auto &c : home) c = toupper(c);
          std::string origin = p[3];
          for (auto &c : origin) c = toupper(c);
          s.p_takeoff = !home.empty() && origin == home;
          s.p_index = id(plane_idx); s.p_count = id(plane_queue).size();
          s.p_remaining = 1.0f - std::min(1.0f, (now - id(plane_start_ms)) / 15000.0f);
        }
        // Sendspin artwork belongs to the ball's own playback: show it on the
        // player screen whose current title matches the Sendspin track.
        if (id(art_ready) && s.cur_slot >= 0 && s.cur_slot < 6 && s.slots[s.cur_slot].music() &&
            !id(np_title).state.empty() && id(np_title).state == s.slots[s.cur_slot].title) {
          s.art = id(artwork_img).get_data_start();
          s.art_w = id(artwork_img).get_width(); s.art_h = id(artwork_img).get_height();
          s.art_led = id(artwork_style).active_index().value_or(0) == 0;
        }
        int v = id(ui_view);
        s.screen = id(overlay) == pixizhi::OVERLAY_NOTIFICATIONS ? S_ALERTS : id(overlay) == pixizhi::OVERLAY_TIMER ? S_TIMER
            : (id(cur_slot) == pixizhi::SLOT_PIZZA && v == pixizhi::VIEW_STANDBY) ? S_PIZZA : v;
      }
  - id: art_ready
    type: bool
    initial_value: "false"
  # What's-that-plane queue: one entry per new plane (model, flight, airline, from, to, callsign).
  - id: plane_queue
    type: std::vector<std::array<std::string, 6>>
  - id: plane_shown
    type: std::vector<std::string>
  - id: plane_active
    type: bool
    initial_value: "false"
  - id: plane_idx
    type: int
    initial_value: "0"
  - id: plane_start_ms
    type: uint32_t
    initial_value: "0"
  - id: plane_prev_view
    type: int
    initial_value: "0"
  - id: plane_prev_slot
    type: int
    initial_value: "-1"
  - id: wheel_rgb
    type: int
    initial_value: "0xFFFFFF"
  - id: loaded_pic
    type: std::string
    initial_value: '""'
  - id: bl_requested
    type: float
    initial_value: "1.0"
  - id: bl_dimmed
    type: bool
    initial_value: "false"
  - id: gs_ring_candidate
    type: bool
    initial_value: "false"
  - id: gs_rotating
    type: bool
    initial_value: "false"
  - id: gs_angle
    type: float
    initial_value: "0"
  - id: gs_turn
    type: float
    initial_value: "0"
  - id: gs_target_brightness
    type: float
    initial_value: "1.0"
  - id: gs_base_brightness
    type: float
    initial_value: "1.0"
  - id: gs_last_apply
    type: uint32_t
    initial_value: "0"
  - id: gs_max_move
    type: int
    initial_value: "0"
  - id: gs_touch_id
    type: int
    initial_value: "-1"
  # swipe detector
  - id: gs_clock_origin
    type: bool
    initial_value: "false"
  - id: gs_touch_active
    type: bool
    initial_value: "false"
  - id: gs_start_x
    type: int
    initial_value: "0"
  - id: gs_start_y
    type: int
    initial_value: "0"
  - id: gs_last_x
    type: int
    initial_value: "0"
  - id: gs_last_y
    type: int
    initial_value: "0"
  - id: gs_start_ms
    type: uint32_t
    initial_value: "0"

# --- DEEP STANDBY ---------------------------------------------------------------
# The touch controller pulls its interrupt line low on a touch, which wakes the chip.
deep_sleep:
  id: deep_standby
  wakeup_pin:
    number: GPIO12
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

# --- BUSES --------------------------------------------------------------------
i2c:
  - id: bus_a
    sda: 15
    scl: 14
    scan: false
  - id: bus_b
    sda: 11
    scl: 7
    scan: false

spi:
  - id: spi_bus
    clk_pin: GPIO4
    mosi_pin: GPIO2

# --- AUDIO / SENDSPIN: runtime internal/USB output selection -------------------
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

audio_dac:
  - platform: es8311
    i2c_id: bus_a
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000

speaker:
  - platform: i2s_audio
    id: internal_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    buffer_duration: 100ms
  - platform: usb_audio
    id: usb_speaker
    software_volume: true
    usb_audio_id: usb_audio_bus
    sample_rate: 48000
    bits_per_sample: 16bit
    num_channels: 2
    buffer_size: 6400
  - platform: router
    id: box_speaker
    output_speakers:
      - internal_speaker
      - usb_speaker
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 2

  # Normalize channels and sample width before the fixed-format output router.
  # Two real inputs serve media playback and independent HA announcements.
  - platform: mixer
    id: playback_mixer
    output_speaker: box_speaker
    num_channels: 2
    bits_per_sample: 16
    source_speakers:
      - id: media_mixer_input
        sample_rate: 48000
        num_channels: 2
        bits_per_sample: 16
        buffer_duration: 100ms
      - id: announcement_mixer_input
        sample_rate: 48000
        num_channels: 2
        bits_per_sample: 16
        buffer_duration: 100ms
  # Resamplers normalize rate/width; the mixer above handles channel conversion.
  - platform: resampler
    id: media_resampler
    output_speaker: media_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 100ms
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 100ms

sendspin:
  id: sendspin_hub
  # Encrypted connections alone do not restrict which servers may play.
  unpaired_access: false
  on_display_pairing_code:
    - lambda: |-
        lv_label_set_text(id(pairing_heading), "SENDSPIN PAIR");
        lv_label_set_text(id(pairing_digits), code.c_str());
        lv_label_set_text(id(pairing_hint), "Enter in Music Assistant");
        id(sendspin_pairing_visible) = true;
        id(gs_touch_active) = false;
        id(gs_ring_candidate) = false;
        lv_obj_clear_flag(id(pairing_card), LV_OBJ_FLAG_HIDDEN);
        id(lvgl_comp).set_paused(false, false);
        id(bl_dimmed) = false;
        id(apply_backlight).execute();
  on_clear_pairing_code:
    - lambda: |-
        lv_label_set_text(id(pairing_digits), "");
        lv_obj_add_flag(id(pairing_card), LV_OBJ_FLAG_HIDDEN);
        id(sendspin_pairing_visible) = false;
  on_open_pairing_window:
    - lambda: |-
        lv_label_set_text(id(pairing_heading), "PAIRING WAITING");
        lv_label_set_text(id(pairing_digits), "ALLOW?");
        lv_label_set_text(id(pairing_hint), "Tap ALLOW to retry pairing");
        id(sendspin_pairing_visible) = true;
        id(gs_touch_active) = false;
        id(gs_ring_candidate) = false;
        lv_obj_clear_flag(id(pairing_card), LV_OBJ_FLAG_HIDDEN);
        id(lvgl_comp).set_paused(false, false);
        id(bl_dimmed) = false;
        id(apply_backlight).execute();
  on_close_pairing_window:
    - lambda: |-
        lv_obj_add_flag(id(pairing_card), LV_OBJ_FLAG_HIDDEN);
        id(sendspin_pairing_visible) = false;
  on_pairing_succeeded:
    - logger.log: "Sendspin server paired; trusted access saved"
  on_pairing_failed:
    - logger.log:
        level: WARN
        format: "Sendspin pairing failed: %s"
        args: [reason.c_str()]

# Siren sound, baked into the firmware. Replace the file with any WAV/MP3/FLAC
# of your own (same name), or point "file:" at a URL, then reinstall.
audio_file:
  - id: siren_sound
    file: sounds/alarm.wav
  - id: chime_sound
    file: sounds/chime.wav

# Album artwork from the Sendspin server, decoded to 104x104 RGB565.
image:
  - platform: sendspin
    id: artwork_slot
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 104x104
    current_image:
      id: artwork_img
    on_image_display:
      - lambda: id(art_ready) = true;
      - script.execute: ui_render
    on_image_clear:
      - lambda: id(art_ready) = false;
      - script.execute: ui_render

media_source:
  - platform: sendspin
    id: sendspin_source
  - platform: audio_file
    id: file_source
  - platform: audio_file
    id: announcement_file_source

media_player:
  - platform: speaker_source
    id: ball_media_player
    name: None
    media_pipeline:
      speaker: media_resampler
      sources:
        - sendspin_source
        - file_source
    announcement_pipeline:
      speaker: announcement_resampler
      sources:
        - announcement_file_source
    on_state:
      - script.execute: audio_display_policy
      - script.execute: update_now_playing

text_sensor:
  - platform: template
    id: timer_ends_sensor
    name: Timer Ends
    icon: mdi:timer-sand
    device_class: timestamp
    update_interval: never
  - platform: template
    id: timer_state_sensor
    name: Timer State
