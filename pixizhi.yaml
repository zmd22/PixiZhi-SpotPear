          condition:
            lambda: return id(siren_active);
          then:
            - lambda: id(siren_active) = false;
            - media_player.stop: ball_media_player
            - delay: 150ms
            - script.execute: apply_audio_output
            - script.wait: apply_audio_output
            - media_player.volume_set:
                id: ball_media_player
                volume: !lambda return id(siren_prev_volume);
            - lambda: |-
                lv_obj_add_flag(id(siren_card), LV_OBJ_FLAG_HIDDEN);
                // Hand the LED back to notifications, or switch it off.
                if (id(nq_title).empty()) { auto c = id(led).turn_off(); c.perform(); id(notif_led_on) = false; }
