                  - sendspin.confirm_pairing_window: sendspin_hub
            - button:
                align: CENTER
                x: 46
                y: 74
                width: 80
                height: 34
                radius: 17
                bg_color: 0x303030
                widgets:
                  - label:
                      align: CENTER
                      text: HIDE
                      text_font: pixel_small
                on_click:
                  - lambda: |-
                      lv_obj_add_flag(id(pairing_card), LV_OBJ_FLAG_HIDDEN);
                      id(sendspin_pairing_visible) = false;
